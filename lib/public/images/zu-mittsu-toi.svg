<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" role="img" aria-label="3つの問いの図。テーマ『本を読めていない』に対し、なぜ(原因)、どうすれば(方法)、本当に(前提)の3つの問いを立てる。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="800" height="350" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="347" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">3つの問い</text><rect x="254" y="66" width="300" height="56" fill="#1a1a1a"/><rect x="250" y="62" width="300" height="56" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="400.0" y="95.2" font-size="19" text-anchor="middle" fill="#1a1a1a">テーマ:本を読めていない</text><rect x="24" y="194" width="240" height="76" fill="#1a1a1a"/><rect x="20" y="190" width="240" height="76" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="140.0" y="220.4" font-size="19" text-anchor="middle" fill="#1a1a1a">なぜ?</text><text x="140.0" y="246.1" font-size="19" text-anchor="middle" fill="#1a1a1a">(原因)</text><line x1="400" y1="122" x2="140" y2="188" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><text x="140" y="305" font-size="15" text-anchor="middle" fill="#1a1a1a">なぜ時間がとれない?</text><rect x="284" y="194" width="240" height="76" fill="#1a1a1a"/><rect x="280" y="190" width="240" height="76" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="400.0" y="220.4" font-size="19" text-anchor="middle" fill="#1a1a1a">どうすれば?</text><text x="400.0" y="246.1" font-size="19" text-anchor="middle" fill="#1a1a1a">(方法)</text><line x1="400" y1="122" x2="400" y2="188" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><text x="400" y="305" font-size="15" text-anchor="middle" fill="#1a1a1a">どうすれば15分確保できる?</text><rect x="544" y="194" width="240" height="76" fill="#1a1a1a"/><rect x="540" y="190" width="240" height="76" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="660.0" y="220.4" font-size="19" text-anchor="middle" fill="#1a1a1a">本当に?</text><text x="660.0" y="246.1" font-size="19" text-anchor="middle" fill="#1a1a1a">(前提)</text><line x1="400" y1="122" x2="660" y2="188" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><text x="660" y="305" font-size="15" text-anchor="middle" fill="#1a1a1a">目標が高すぎない?</text><text x="400" y="338" font-size="16" text-anchor="middle" fill="#d8352a" font-weight="700">3つのうち、いちばん答えたいものに丸をつける</text></svg>