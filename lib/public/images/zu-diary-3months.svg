<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="手書き日記の図。寝る前5〜10分、大学ノートとボールペンで、出来事、気になったこと、翌日にやることを書いた。最初の1か月は続いたが、仕事が立て込むと負担になり、書かなくなった。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="800" height="360" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="357" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">手書き日記を3か月:やり方と、つまずき</text><rect x="34" y="72" width="340" height="232" fill="#1a1a1a"/><rect x="30" y="68" width="340" height="232" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><line x1="42" y1="76" x2="42" y2="292" stroke="#d8352a" stroke-width="2"/><text x="200" y="100" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="700">寝る前5〜10分(大学ノート+ボールペン)</text><text x="58" y="150" font-size="18" text-anchor="start" fill="#1a1a1a" font-weight="700">① その日の出来事</text><line x1="56" y1="162" x2="354" y2="162" stroke="#1a1a1a" stroke-width="2.5"/><text x="58" y="200" font-size="18" text-anchor="start" fill="#1a1a1a" font-weight="700">② 気になったこと</text><line x1="56" y1="212" x2="354" y2="212" stroke="#1a1a1a" stroke-width="2.5"/><text x="58" y="250" font-size="18" text-anchor="start" fill="#1a1a1a" font-weight="700">③ 翌日にやること</text><line x1="56" y1="262" x2="354" y2="262" stroke="#1a1a1a" stroke-width="2.5"/><text x="200" y="292" font-size="14" text-anchor="middle" fill="#5b5b57">箇条書きでよい。きれいな文章にしない</text><rect x="424" y="114" width="112" height="80" fill="#1a1a1a"/><rect x="420" y="110" width="112" height="80" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="476.0" y="144.0" font-size="15" text-anchor="middle" fill="#1a1a1a">最初の1か月</text><text x="476.0" y="164.2" font-size="15" text-anchor="middle" fill="#1a1a1a">比較的続いた</text><line x1="534" y1="150" x2="543" y2="150" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="549" y="114" width="112" height="80" fill="#1a1a1a"/><rect x="545" y="110" width="112" height="80" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="601.0" y="144.0" font-size="15" text-anchor="middle" fill="#1a1a1a">仕事が</text><text x="601.0" y="164.2" font-size="15" text-anchor="middle" fill="#1a1a1a">立て込む</text><line x1="659" y1="150" x2="668" y2="150" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="674" y="114" width="112" height="80" fill="#1a1a1a"/><rect x="670" y="110" width="112" height="80" fill="#ffd6d2" stroke="#1a1a1a" stroke-width="2.5"/><text x="726.0" y="144.0" font-size="15" text-anchor="middle" fill="#1a1a1a">負担になり</text><text x="726.0" y="164.2" font-size="15" text-anchor="middle" fill="#1a1a1a">書かなくなった</text><text x="595" y="230" font-size="15" text-anchor="middle" fill="#d8352a" font-weight="700">毎日を目標にした → 書けない日で止まった</text><text x="595" y="258" font-size="15" text-anchor="middle" fill="#d8352a" font-weight="700">習慣にすること自体が、目的になっていた</text></svg>