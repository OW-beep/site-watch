<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" role="img" aria-label="読書ノートの図。書名と日付、印象に残った箇所、自分の仕事にどう使えるかの1行を書く。全部の本で書くことや、きれいにまとめることはやめた。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="800" height="350" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="347" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">読書ノート:書き写しより「使い道1行」</text><rect x="34" y="72" width="440" height="250" fill="#1a1a1a"/><rect x="30" y="68" width="440" height="250" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><line x1="42" y1="76" x2="42" y2="310" stroke="#d8352a" stroke-width="2"/><text x="58" y="118" font-size="19" text-anchor="start" fill="#1a1a1a" font-weight="700">書名・日付</text><text x="58" y="142" font-size="14" text-anchor="start" fill="#5b5b57">あとで探せるように</text><line x1="56" y1="152" x2="454" y2="152" stroke="#1a1a1a" stroke-width="2.5"/><text x="58" y="184" font-size="19" text-anchor="start" fill="#1a1a1a" font-weight="700">印象に残った箇所</text><text x="58" y="208" font-size="14" text-anchor="start" fill="#5b5b57">ここは書き写してよい</text><line x1="56" y1="218" x2="454" y2="218" stroke="#1a1a1a" stroke-width="2.5"/><text x="58" y="250" font-size="19" text-anchor="start" fill="#1a1a1a" font-weight="700">自分の仕事にどう使えるか</text><text x="58" y="274" font-size="14" text-anchor="start" fill="#5b5b57">ここを1行、必ず書く</text><line x1="56" y1="284" x2="454" y2="284" stroke="#1a1a1a" stroke-width="2.5"/><rect x="504" y="84" width="270" height="108" fill="#1a1a1a"/><rect x="500" y="80" width="270" height="108" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="635.0" y="116.8" font-size="16" text-anchor="middle" fill="#1a1a1a">続いたこと</text><text x="635.0" y="138.4" font-size="16" text-anchor="middle" fill="#1a1a1a">仕事に応用できそうな</text><text x="635.0" y="160.0" font-size="16" text-anchor="middle" fill="#1a1a1a">部分だけを書き残す</text><rect x="504" y="212" width="270" height="108" fill="#1a1a1a"/><rect x="500" y="208" width="270" height="108" fill="#ffd6d2" stroke="#1a1a1a" stroke-width="2.5"/><text x="635.0" y="244.8" font-size="16" text-anchor="middle" fill="#1a1a1a">やめたこと</text><text x="635.0" y="266.4" font-size="16" text-anchor="middle" fill="#1a1a1a">全部の本で書く</text><text x="635.0" y="288.0" font-size="16" text-anchor="middle" fill="#1a1a1a">きれいにまとめる</text></svg>