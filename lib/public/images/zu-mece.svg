<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 385" width="800" height="385" role="img" aria-label="MECEの図。年代で6つに分けるともれもダブりもない。学生、会社員、男性のように軸が混ざると重なりが出る。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="800" height="385" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="382" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">MECE:もれなく、ダブりなく</text><text x="200" y="80" font-size="17" text-anchor="middle" fill="#2E7D4F" font-weight="700">○ 軸が1つ(年代で分ける)</text><rect x="30" y="98" width="112" height="85" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="86.0" y="144.9" font-size="16" text-anchor="middle" fill="#1a1a1a">19歳以下</text><rect x="150" y="98" width="112" height="85" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="206.0" y="144.9" font-size="16" text-anchor="middle" fill="#1a1a1a">20代</text><rect x="270" y="98" width="112" height="85" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="326.0" y="144.9" font-size="16" text-anchor="middle" fill="#1a1a1a">30代</text><rect x="30" y="193" width="112" height="85" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="86.0" y="239.9" font-size="16" text-anchor="middle" fill="#1a1a1a">40代</text><rect x="150" y="193" width="112" height="85" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="206.0" y="239.9" font-size="16" text-anchor="middle" fill="#1a1a1a">50代</text><rect x="270" y="193" width="112" height="85" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="326.0" y="239.9" font-size="16" text-anchor="middle" fill="#1a1a1a">60歳以上</text><text x="200" y="320" font-size="16" text-anchor="middle" fill="#2E7D4F" font-weight="700">もれもダブりもない</text><text x="600" y="80" font-size="17" text-anchor="middle" fill="#d8352a" font-weight="700">× 軸が混ざる(立場+性別)</text><circle cx="520" cy="190" r="72" fill="#2f5dab" fill-opacity="0.22" stroke="#1a1a1a" stroke-width="2.5"/><text x="485" y="165" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="700">学生</text><circle cx="620" cy="190" r="72" fill="#f0b400" fill-opacity="0.22" stroke="#1a1a1a" stroke-width="2.5"/><text x="655" y="165" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="700">会社員</text><circle cx="570" cy="265" r="72" fill="#d8352a" fill-opacity="0.22" stroke="#1a1a1a" stroke-width="2.5"/><text x="570" y="300" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="700">男性</text><text x="600" y="372" font-size="15" text-anchor="middle" fill="#d8352a" font-weight="700">「男性の会社員」が両方に入る(ダブり)</text></svg>