<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" role="img" aria-label="スマホを置く場面と使う場面の図。食事中、家族と過ごす時間、寝る30分前は手の届かない場所に置き、仕事の連絡と調べ物では使う。通知は必要なものだけに絞る。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="800" height="350" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="347" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">スマホは「やめる」より「場面を決める」</text><rect x="34" y="74" width="360" height="200" fill="#1a1a1a"/><rect x="30" y="70" width="360" height="200" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="210" y="102" font-size="20" text-anchor="middle" fill="#1a1a1a" font-weight="700">置く場面</text><text x="60" y="150" font-size="18" text-anchor="start" fill="#1a1a1a">・食事中</text><text x="60" y="186" font-size="18" text-anchor="start" fill="#1a1a1a">・家族と過ごす時間</text><text x="60" y="222" font-size="18" text-anchor="start" fill="#1a1a1a">・寝る30分前から</text><text x="210" y="258" font-size="14" text-anchor="middle" fill="#5b5b57">手の届かない場所に置く</text><rect x="414" y="74" width="360" height="200" fill="#1a1a1a"/><rect x="410" y="70" width="360" height="200" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="590" y="102" font-size="20" text-anchor="middle" fill="#1a1a1a" font-weight="700">使う場面</text><text x="440" y="150" font-size="18" text-anchor="start" fill="#1a1a1a">・仕事の連絡</text><text x="440" y="186" font-size="18" text-anchor="start" fill="#1a1a1a">・調べもの</text><text x="590" y="258" font-size="14" text-anchor="middle" fill="#5b5b57">目的を決めて使う</text><rect x="34" y="292" width="740" height="44" fill="#1a1a1a"/><rect x="30" y="288" width="740" height="44" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="400.0" y="314.7" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="700">通知は、必要なものだけに絞る。完全にやめようとしない</text></svg>