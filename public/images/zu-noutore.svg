<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-label="脳トレで上手くなる範囲を3つに分けた図。やった問題そのものは上手くなる。似た問題には少し広がることがある。まったく別の力、仕事の判断や会話にまで効くとは言えない。効くかどうかではなく、何に効くかで選ぶのが物差しになる。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><rect width="800" height="340" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="337" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">脳トレで上手くなるのは、どこまでか</text><rect x="34" y="78" width="230" height="56" fill="#1a1a1a"/><rect x="30" y="74" width="230" height="56" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="145" y="98" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">やった問題そのもの</text><text x="145" y="121" font-size="14" text-anchor="middle" fill="#1a1a1a">はっきり上手くなる</text><text x="145" y="162" font-size="14" text-anchor="middle" fill="#1a1a1a">計算ドリルなら、計算が速くなる</text><rect x="289" y="78" width="230" height="56" fill="#1a1a1a"/><rect x="285" y="74" width="230" height="56" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/><text x="400" y="98" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">似た問題</text><text x="400" y="121" font-size="14" text-anchor="middle" fill="#1a1a1a">少し広がることがある</text><text x="400" y="162" font-size="14" text-anchor="middle" fill="#1a1a1a">形が近い問題には、慣れが効く</text><rect x="544" y="78" width="230" height="56" fill="#1a1a1a"/><rect x="540" y="74" width="230" height="56" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/><text x="655" y="98" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">まったく別の力</text><text x="655" y="121" font-size="14" text-anchor="middle" fill="#1a1a1a">効くとは言いにくい</text><text x="655" y="162" font-size="14" text-anchor="middle" fill="#1a1a1a">仕事の判断や会話は、別の話</text><text x="272" y="110" font-size="20" font-weight="700" text-anchor="middle" fill="#d8352a">→</text><text x="527" y="110" font-size="20" font-weight="700" text-anchor="middle" fill="#d8352a">→</text><rect x="120" y="216" width="560" height="64" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="400" y="242" font-size="17" font-weight="700" text-anchor="middle" fill="#1a1a1a">「効くか」ではなく「何に効くか」で選ぶ</text><text x="400" y="268" font-size="15" text-anchor="middle" fill="#1a1a1a">上手くなる範囲を先に決めると、期待外れがなくなる</text><line x1="145" y1="176" x2="300" y2="212" stroke="#1a1a1a" stroke-width="2.5"/><line x1="400" y1="176" x2="400" y2="212" stroke="#1a1a1a" stroke-width="2.5"/><line x1="655" y1="176" x2="500" y2="212" stroke="#1a1a1a" stroke-width="2.5"/></svg>
