<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-label="数学は役に立つかを3つに分けた図。計算そのものを使う場面、考え方を使う場面、使わない場面。3つに分けると、賛成と反対の両方の言い分に一理あることが分かる。結論は、どの数学が、誰の、何に役立つかまで言わないと決まらない。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><rect width="800" height="320" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="317" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">「役に立つ」を分けると、議論が進む</text><rect x="34" y="74" width="230" height="56" fill="#1a1a1a"/><rect x="30" y="70" width="230" height="56" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="145" y="105" font-size="19" font-weight="700" text-anchor="middle" fill="#1a1a1a">計算そのもの</text><text x="145" y="155" font-size="15" text-anchor="middle" fill="#1a1a1a">割り勘・比較・割合の感覚</text><rect x="289" y="74" width="230" height="56" fill="#1a1a1a"/><rect x="285" y="70" width="230" height="56" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/><text x="400" y="105" font-size="19" font-weight="700" text-anchor="middle" fill="#1a1a1a">考え方</text><text x="400" y="155" font-size="15" text-anchor="middle" fill="#1a1a1a">分ける・順序立てる・確かめる</text><rect x="544" y="74" width="230" height="56" fill="#1a1a1a"/><rect x="540" y="70" width="230" height="56" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/><text x="655" y="105" font-size="19" font-weight="700" text-anchor="middle" fill="#1a1a1a">使わない場面</text><text x="655" y="155" font-size="15" text-anchor="middle" fill="#1a1a1a">難しい計算を直接使う仕事は少数</text><rect x="90" y="196" width="620" height="64" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="400" y="222" font-size="17" font-weight="700" text-anchor="middle" fill="#1a1a1a">結論は「どの数学が・誰の・何に」で決まる</text><text x="400" y="248" font-size="15" text-anchor="middle" fill="#1a1a1a">賛成も反対も、見ている場面が違うだけかもしれない</text><line x1="145" y1="168" x2="300" y2="192" stroke="#1a1a1a" stroke-width="2.5"/><line x1="400" y1="168" x2="400" y2="192" stroke="#1a1a1a" stroke-width="2.5"/><line x1="655" y1="168" x2="500" y2="192" stroke="#1a1a1a" stroke-width="2.5"/></svg>
