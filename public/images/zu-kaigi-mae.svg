<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" width="800" height="370" role="img" aria-label="会議前の準備の図。前回の議事録と課題管理表を見て、A4用紙1枚に、今回決めたいこと、前回から変わったこと、確認が必要なこと、誰に何を確認するか、終了時の状態を書く。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="800" height="370" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="367" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">会議の前:A4用紙1枚に、5つを書き出す</text><rect x="34" y="70" width="440" height="270" fill="#1a1a1a"/><rect x="30" y="66" width="440" height="270" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><line x1="42" y1="74" x2="42" y2="328" stroke="#d8352a" stroke-width="2"/><text x="58" y="108" font-size="17" text-anchor="start" fill="#1a1a1a" font-weight="700">① 今回の会議で、決めたいこと</text><line x1="56" y1="122" x2="454" y2="122" stroke="#1a1a1a" stroke-width="2.5"/><text x="58" y="158" font-size="17" text-anchor="start" fill="#1a1a1a">② 前回から、変わったこと</text><line x1="56" y1="172" x2="454" y2="172" stroke="#1a1a1a" stroke-width="2.5"/><text x="58" y="208" font-size="17" text-anchor="start" fill="#1a1a1a">③ 確認が必要なこと</text><line x1="56" y1="222" x2="454" y2="222" stroke="#1a1a1a" stroke-width="2.5"/><text x="58" y="258" font-size="17" text-anchor="start" fill="#1a1a1a">④ 誰に、何を確認するか</text><line x1="56" y1="272" x2="454" y2="272" stroke="#1a1a1a" stroke-width="2.5"/><text x="58" y="308" font-size="17" text-anchor="start" fill="#1a1a1a" font-weight="700">⑤ 終了時に、どういう状態か</text><line x1="56" y1="322" x2="454" y2="322" stroke="#1a1a1a" stroke-width="2.5"/><rect x="504" y="80" width="270" height="70" fill="#1a1a1a"/><rect x="500" y="76" width="270" height="70" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="635.0" y="105.0" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="700">ねらい</text><text x="635.0" y="125.2" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="700">「今日、何を決めるのか」を明確に</text><rect x="504" y="170" width="270" height="80" fill="#1a1a1a"/><rect x="500" y="166" width="270" height="80" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="635.0" y="191.0" font-size="14" text-anchor="middle" fill="#1a1a1a">気をつけること①</text><text x="635.0" y="209.9" font-size="14" text-anchor="middle" fill="#1a1a1a">資料を完璧にすることが</text><text x="635.0" y="228.8" font-size="14" text-anchor="middle" fill="#1a1a1a">目的にならないようにする</text><rect x="504" y="270" width="270" height="70" fill="#1a1a1a"/><rect x="500" y="266" width="270" height="70" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="635.0" y="295.4" font-size="14" text-anchor="middle" fill="#1a1a1a">気をつけること②</text><text x="635.0" y="314.3" font-size="14" text-anchor="middle" fill="#1a1a1a">結論を決めつけず、論点を整理する</text></svg>