<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 375" width="800" height="375" role="img" aria-label="ロジックツリーの図。電気代は8,000円から10,400円に30%増。使用量が250から330キロワット時に32%増えたのが原因で、単価と基本料金は変わらない。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="800" height="375" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="372" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">電気代が上がった理由を、ツリーで探す</text><rect x="24" y="154" width="190" height="84" fill="#1a1a1a"/><rect x="20" y="150" width="190" height="84" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="115.0" y="174.8" font-size="16" text-anchor="middle" fill="#1a1a1a">電気代</text><text x="115.0" y="196.4" font-size="16" text-anchor="middle" fill="#1a1a1a">8,000→10,400円</text><text x="115.0" y="218.0" font-size="16" text-anchor="middle" fill="#1a1a1a">(+30%)</text><rect x="269" y="80" width="215" height="84" fill="#1a1a1a"/><rect x="265" y="76" width="215" height="84" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="372.5" y="100.8" font-size="16" text-anchor="middle" fill="#1a1a1a">使用量</text><text x="372.5" y="122.4" font-size="16" text-anchor="middle" fill="#1a1a1a">250→330kWh</text><text x="372.5" y="144.0" font-size="16" text-anchor="middle" fill="#1a1a1a">(+32%)</text><rect x="269" y="248" width="215" height="84" fill="#1a1a1a"/><rect x="265" y="244" width="215" height="84" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="372.5" y="269.9" font-size="15" text-anchor="middle" fill="#1a1a1a">単価・基本料金</text><text x="372.5" y="290.1" font-size="15" text-anchor="middle" fill="#1a1a1a">30円/kWh・500円</text><text x="372.5" y="310.4" font-size="15" text-anchor="middle" fill="#1a1a1a">(変化なし)</text><line x1="212" y1="180" x2="263" y2="126" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><line x1="212" y1="205" x2="263" y2="274" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="549" y="40" width="235" height="56" fill="#1a1a1a"/><rect x="545" y="36" width="235" height="56" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="662.5" y="68.1" font-size="15" text-anchor="middle" fill="#1a1a1a">エアコンを使う日が増えた?</text><line x1="482" y1="118" x2="543" y2="64" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="549" y="112" width="235" height="56" fill="#1a1a1a"/><rect x="545" y="108" width="235" height="56" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="662.5" y="140.1" font-size="15" text-anchor="middle" fill="#1a1a1a">家にいる時間が増えた?</text><line x1="482" y1="118" x2="543" y2="136" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="549" y="184" width="235" height="56" fill="#1a1a1a"/><rect x="545" y="180" width="235" height="56" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="662.5" y="212.1" font-size="15" text-anchor="middle" fill="#1a1a1a">家電が増えた?</text><line x1="482" y1="118" x2="543" y2="208" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><text x="662" y="262" font-size="17" text-anchor="middle" fill="#d8352a" font-weight="700">▲ 次に確かめる仮説</text><text x="400" y="360" font-size="16" text-anchor="middle" fill="#d8352a" font-weight="700">先に「どこが増えたか」を数字で特定。原因の想像は、そのあと</text></svg>