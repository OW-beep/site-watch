<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 412" width="800" height="412" role="img" aria-label="大人の覚え方の図。読み直しだけでは翌日に消える。代わりに、閉じて説明する、間を空けて思い出す、事例と結ぶ、の3つに変える。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="800" height="412" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="409" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">大人の覚え方:読み直しをやめて、3つに変える</text><rect x="24" y="66" width="250" height="58" fill="#1a1a1a"/><rect x="20" y="62" width="250" height="58" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="145.0" y="95.9" font-size="18" text-anchor="middle" fill="#d8352a" font-weight="700">読み直しだけ</text><rect x="284" y="66" width="500" height="58" fill="#1a1a1a"/><rect x="280" y="62" width="500" height="58" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="530.0" y="95.9" font-size="18" text-anchor="middle" fill="#1a1a1a">「分かった気」になるだけ。翌日には消える</text><rect x="24" y="138" width="250" height="58" fill="#1a1a1a"/><rect x="20" y="134" width="250" height="58" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="145.0" y="167.9" font-size="18" text-anchor="middle" fill="#1a1a1a" font-weight="700">① 閉じて説明する</text><rect x="284" y="138" width="500" height="58" fill="#1a1a1a"/><rect x="280" y="134" width="500" height="58" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="530.0" y="167.9" font-size="18" text-anchor="middle" fill="#1a1a1a">読んだら本を閉じて、自分の言葉で言ってみる</text><rect x="24" y="210" width="250" height="58" fill="#1a1a1a"/><rect x="20" y="206" width="250" height="58" fill="#2E7D4F" stroke="#1a1a1a" stroke-width="2.5"/><text x="145.0" y="239.9" font-size="18" text-anchor="middle" fill="#fff" font-weight="700">② 間を空けて思い出す</text><rect x="284" y="210" width="500" height="58" fill="#1a1a1a"/><rect x="280" y="206" width="500" height="58" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="530.0" y="239.9" font-size="18" text-anchor="middle" fill="#1a1a1a">翌日・3日後・1週間後に、見ないで思い出す</text><rect x="24" y="282" width="250" height="58" fill="#1a1a1a"/><rect x="20" y="278" width="250" height="58" fill="#2f5dab" stroke="#1a1a1a" stroke-width="2.5"/><text x="145.0" y="311.9" font-size="18" text-anchor="middle" fill="#fff" font-weight="700">③ 事例と結ぶ</text><rect x="284" y="282" width="500" height="58" fill="#1a1a1a"/><rect x="280" y="278" width="500" height="58" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="530.0" y="311.9" font-size="18" text-anchor="middle" fill="#1a1a1a">仕事や暮らしの、知っている話とつなげる</text><text x="400" y="382" font-size="16" text-anchor="middle" fill="#d8352a" font-weight="700">覚えるのは「読む回数」ではなく「思い出す回数」で決まる</text></svg>
