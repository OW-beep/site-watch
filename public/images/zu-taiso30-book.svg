<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" aria-label="小冊子『頭の体操30日』の中身の図。第1週は白帯で数字で遊ぶ、第2週は黄帯で言葉で遊ぶ、第3週は緑帯で分けて考える、第4週は青帯で暮らしと家族で使う、総仕上げは黒帯。入手方法はKindle本99円と、このサイトで配る無料PDFの2つ。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><rect width="800" height="430" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="427" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">『頭の体操30日』は、週ごとに帯が進みます</text>
<g font-size="17" fill="#1a1a1a">
<rect x="44" y="66" width="712" height="44" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><rect x="58" y="76" width="64" height="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><text x="90" y="94" font-size="15" font-weight="700" text-anchor="middle">白帯</text><text x="140" y="95" font-weight="700">第1週</text><text x="230" y="95">数字で遊ぶ ― 暗算、ペアで考える足し算、割引</text>
<rect x="44" y="118" width="712" height="44" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><rect x="58" y="128" width="64" height="24" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2"/><text x="90" y="146" font-size="15" font-weight="700" text-anchor="middle">黄帯</text><text x="140" y="147" font-weight="700">第2週</text><text x="230" y="147">言葉で遊ぶ ― 仲間はずれ、回文、連想ゲーム</text>
<rect x="44" y="170" width="712" height="44" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><rect x="58" y="180" width="64" height="24" fill="#7fb069" stroke="#1a1a1a" stroke-width="2"/><text x="90" y="198" font-size="15" font-weight="700" text-anchor="middle">緑帯</text><text x="140" y="199" font-weight="700">第3週</text><text x="230" y="199">分けて考える ― なぜなぜ、見当をつける、条件で絞る</text>
<rect x="44" y="222" width="712" height="44" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><rect x="58" y="232" width="64" height="24" fill="#2f5da8" stroke="#1a1a1a" stroke-width="2"/><text x="90" y="250" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">青帯</text><text x="140" y="251" font-weight="700">第4週</text><text x="230" y="251">暮らしと家族で使う ― 数当て、30秒で説明、買い物</text>
<rect x="44" y="274" width="712" height="44" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><rect x="58" y="284" width="64" height="24" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2"/><text x="90" y="302" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">黒帯</text><text x="140" y="303" font-weight="700">総仕上げ</text><text x="230" y="303">問題を「作る側」に回る2日間</text>
</g>
<rect x="48" y="342" width="340" height="62" fill="#1a1a1a"/><rect x="44" y="338" width="340" height="62" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/><text x="214" y="364" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="middle">Kindle本 ― 99円</text><text x="214" y="388" font-size="14" fill="#1a1a1a" text-anchor="middle">持ち歩きたい人、応援したい人へ</text>
<rect x="416" y="342" width="340" height="62" fill="#1a1a1a"/><rect x="412" y="338" width="340" height="62" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="582" y="364" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="middle">PDF ― このサイトで無料</text><text x="582" y="388" font-size="14" fill="#1a1a1a" text-anchor="middle">印刷して、紙とペンで使う人へ</text>
</svg>
