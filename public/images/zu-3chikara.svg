<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-label="検索やAIは答えを出してくれる。人の頭に残したい3つの力は、問いを立てる力、分けて考える力、確かめる力。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="800" height="380" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="377" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">デジタルに負けない頭:残したい3つの力</text><rect x="164" y="68" width="480" height="52" fill="#1a1a1a"/><rect x="160" y="64" width="480" height="52" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="400.0" y="95.2" font-size="19" text-anchor="middle" fill="#1a1a1a" font-weight="700">検索・AIは、「答え」を出してくれる</text><line x1="400" y1="118" x2="138" y2="168" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="24" y="174" width="236" height="90" fill="#1a1a1a"/><rect x="20" y="170" width="236" height="90" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="138.0" y="207.8" font-size="18" text-anchor="middle" fill="#1a1a1a">① 問いを立てる力</text><text x="138.0" y="232.1" font-size="18" text-anchor="middle" fill="#1a1a1a">何を知りたいか</text><rect x="20" y="276" width="236" height="40" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="138.0" y="299.9" font-size="14" text-anchor="middle" fill="#1a1a1a">先に予想・3つの問い</text><line x1="400" y1="118" x2="400" y2="168" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="286" y="174" width="236" height="90" fill="#1a1a1a"/><rect x="282" y="170" width="236" height="90" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="400.0" y="207.8" font-size="18" text-anchor="middle" fill="#1a1a1a">② 分けて考える力</text><text x="400.0" y="232.1" font-size="18" text-anchor="middle" fill="#1a1a1a">何が大事か</text><rect x="282" y="276" width="236" height="40" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="400.0" y="299.9" font-size="14" text-anchor="middle" fill="#1a1a1a">書き出し・分け方</text><line x1="400" y1="118" x2="662" y2="168" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="548" y="174" width="236" height="90" fill="#1a1a1a"/><rect x="544" y="170" width="236" height="90" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="662.0" y="207.8" font-size="18" text-anchor="middle" fill="#1a1a1a">③ 確かめる力</text><text x="662.0" y="232.1" font-size="18" text-anchor="middle" fill="#1a1a1a">本当に正しいか</text><rect x="544" y="276" width="236" height="40" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="662.0" y="299.9" font-size="14" text-anchor="middle" fill="#1a1a1a">ざっくり計算・3つの質問</text><text x="400" y="352" font-size="17" text-anchor="middle" fill="#d8352a" font-weight="700">答えをもらう前と後は、自分の頭の出番</text></svg>