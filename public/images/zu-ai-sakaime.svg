<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="AIに任せる作業と自分に残す判断を分ける図。やり直しがきく、正解がある作業は任せ、責任を自分が取る判断は残す。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="800" height="400" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="397" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">AIに任せる/自分に残す 線引き</text><rect x="24" y="74" width="240" height="50" fill="#1a1a1a"/><rect x="20" y="70" width="240" height="50" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="140.0" y="99.9" font-size="18" text-anchor="middle" fill="#1a1a1a">やり直しがきく?</text><rect x="284" y="74" width="240" height="50" fill="#1a1a1a"/><rect x="280" y="70" width="240" height="50" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="400.0" y="99.9" font-size="18" text-anchor="middle" fill="#1a1a1a">正解がある?</text><rect x="544" y="74" width="240" height="50" fill="#1a1a1a"/><rect x="540" y="70" width="240" height="50" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="660.0" y="99.9" font-size="18" text-anchor="middle" fill="#1a1a1a">責任は自分が取る?</text><text x="200" y="152" font-size="16" text-anchor="middle" fill="#2f5dab" font-weight="700">1・2が「はい」→ AIに任せる</text><text x="600" y="152" font-size="16" text-anchor="middle" fill="#d8352a" font-weight="700">3が「はい」→ 自分に残す</text><rect x="24" y="179" width="360" height="195" fill="#1a1a1a"/><rect x="20" y="175" width="360" height="195" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="200" y="208" font-size="20" text-anchor="middle" fill="#1a1a1a" font-weight="700">AIに任せる(作業)</text><text x="45" y="248" font-size="17" text-anchor="start" fill="#1a1a1a">・下書き、言い回しの候補</text><text x="45" y="276" font-size="17" text-anchor="start" fill="#1a1a1a">・要約、表記ゆれの確認</text><text x="45" y="304" font-size="17" text-anchor="start" fill="#1a1a1a">・表の整形、集計の手順</text><text x="45" y="332" font-size="17" text-anchor="start" fill="#1a1a1a">・アイデアの数出し</text><rect x="424" y="179" width="360" height="195" fill="#1a1a1a"/><rect x="420" y="175" width="360" height="195" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="600" y="208" font-size="20" text-anchor="middle" fill="#d8352a" font-weight="700">自分に残す(問いと判断)</text><text x="445" y="248" font-size="17" text-anchor="start" fill="#1a1a1a">・何を問うか</text><text x="445" y="276" font-size="17" text-anchor="start" fill="#1a1a1a">・どれを採用するか</text><text x="445" y="304" font-size="17" text-anchor="start" fill="#1a1a1a">・人の気持ちが絡む判断</text><text x="445" y="332" font-size="17" text-anchor="start" fill="#1a1a1a">・説明する責任がある内容</text></svg>