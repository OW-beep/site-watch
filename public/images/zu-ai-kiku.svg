<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-label="AIへの聞き方の図。あいまいな聞き方に、目的、条件、形の3点を足すと、使える答えになる。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="800" height="330" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="327" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">AIには「目的・条件・形」を伝える</text><rect x="24" y="124" width="200" height="90" fill="#1a1a1a"/><rect x="20" y="120" width="200" height="90" fill="#ffd6d2" stroke="#1a1a1a" stroke-width="2.5"/><text x="120.0" y="159.0" font-size="15" text-anchor="middle" fill="#1a1a1a">あいまいな聞き方</text><text x="120.0" y="179.2" font-size="15" text-anchor="middle" fill="#1a1a1a">「旅行の計画を立てて」</text><line x1="224" y1="165" x2="280" y2="165" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="289" y="66" width="270" height="66" fill="#1a1a1a"/><rect x="285" y="62" width="270" height="66" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="420.0" y="88.6" font-size="16" text-anchor="middle" fill="#1a1a1a">① 目的</text><text x="420.0" y="110.2" font-size="16" text-anchor="middle" fill="#1a1a1a">誰が、何のために</text><line x1="557" y1="95" x2="600" y2="165" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="289" y="146" width="270" height="66" fill="#1a1a1a"/><rect x="285" y="142" width="270" height="66" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="420.0" y="168.6" font-size="16" text-anchor="middle" fill="#1a1a1a">② 条件</text><text x="420.0" y="190.2" font-size="16" text-anchor="middle" fill="#1a1a1a">予算・時間・できないこと</text><line x1="557" y1="175" x2="600" y2="165" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="289" y="226" width="270" height="66" fill="#1a1a1a"/><rect x="285" y="222" width="270" height="66" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="420.0" y="248.6" font-size="16" text-anchor="middle" fill="#1a1a1a">③ 形</text><text x="420.0" y="270.2" font-size="16" text-anchor="middle" fill="#1a1a1a">表・箇条書き・何案か</text><line x1="557" y1="255" x2="600" y2="165" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="609" y="124" width="175" height="90" fill="#1a1a1a"/><rect x="605" y="120" width="175" height="90" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="692.5" y="158.6" font-size="16" text-anchor="middle" fill="#1a1a1a" font-weight="700">使える答え</text><text x="692.5" y="180.2" font-size="16" text-anchor="middle" fill="#1a1a1a" font-weight="700">(確認は自分で)</text><text x="400" y="312" font-size="16" text-anchor="middle" fill="#d8352a" font-weight="700">足りない情報は、AIに「先に質問して」と頼んでもよい</text></svg>