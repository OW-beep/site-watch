<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" width="800" height="310" role="img" aria-label="ペン選びの図。太さ、書き味とインクの出方、乾きやすさとにじみ、持ちやすさ、価格と替え芯の5つのポイント。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="800" height="310" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="307" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">ペンは「試し書き」で5つを確かめる</text><rect x="304" y="66" width="200" height="46" fill="#1a1a1a"/><rect x="300" y="62" width="200" height="46" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="400.0" y="90.5" font-size="20" text-anchor="middle" fill="#1a1a1a" font-weight="700">試し書き</text><line x1="400" y1="110" x2="85" y2="148" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="24" y="154" width="130" height="40" fill="#1a1a1a"/><rect x="20" y="150" width="130" height="40" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="85.0" y="174.4" font-size="16" text-anchor="middle" fill="#1a1a1a" font-weight="700">太さ</text><rect x="24" y="200" width="130" height="66" fill="#1a1a1a"/><rect x="20" y="196" width="130" height="66" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="85.0" y="223.4" font-size="14" text-anchor="middle" fill="#1a1a1a">小さい字が</text><text x="85.0" y="242.3" font-size="14" text-anchor="middle" fill="#1a1a1a">つぶれない?</text><line x1="400" y1="110" x2="240" y2="148" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="179" y="154" width="130" height="40" fill="#1a1a1a"/><rect x="175" y="150" width="130" height="40" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="240.0" y="174.4" font-size="16" text-anchor="middle" fill="#1a1a1a" font-weight="700">書き味</text><rect x="179" y="200" width="130" height="66" fill="#1a1a1a"/><rect x="175" y="196" width="130" height="66" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="240.0" y="223.4" font-size="14" text-anchor="middle" fill="#1a1a1a">インクが</text><text x="240.0" y="242.3" font-size="14" text-anchor="middle" fill="#1a1a1a">なめらかに出る?</text><line x1="400" y1="110" x2="395" y2="148" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="334" y="154" width="130" height="40" fill="#1a1a1a"/><rect x="330" y="150" width="130" height="40" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="395.0" y="174.4" font-size="16" text-anchor="middle" fill="#1a1a1a" font-weight="700">乾き・にじみ</text><rect x="334" y="200" width="130" height="66" fill="#1a1a1a"/><rect x="330" y="196" width="130" height="66" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="395.0" y="223.4" font-size="14" text-anchor="middle" fill="#1a1a1a">こすっても</text><text x="395.0" y="242.3" font-size="14" text-anchor="middle" fill="#1a1a1a">汚れない?</text><line x1="400" y1="110" x2="550" y2="148" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="489" y="154" width="130" height="40" fill="#1a1a1a"/><rect x="485" y="150" width="130" height="40" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="550.0" y="174.4" font-size="16" text-anchor="middle" fill="#1a1a1a" font-weight="700">持ちやすさ</text><rect x="489" y="200" width="130" height="66" fill="#1a1a1a"/><rect x="485" y="196" width="130" height="66" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="550.0" y="223.4" font-size="14" text-anchor="middle" fill="#1a1a1a">長く書いても</text><text x="550.0" y="242.3" font-size="14" text-anchor="middle" fill="#1a1a1a">疲れない?</text><line x1="400" y1="110" x2="705" y2="148" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="644" y="154" width="130" height="40" fill="#1a1a1a"/><rect x="640" y="150" width="130" height="40" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="705.0" y="174.4" font-size="16" text-anchor="middle" fill="#1a1a1a" font-weight="700">価格</text><rect x="644" y="200" width="130" height="66" fill="#1a1a1a"/><rect x="640" y="196" width="130" height="66" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="705.0" y="223.4" font-size="14" text-anchor="middle" fill="#1a1a1a">替え芯が</text><text x="705.0" y="242.3" font-size="14" text-anchor="middle" fill="#1a1a1a">手に入る?</text><text x="400" y="292" font-size="16" text-anchor="middle" fill="#d8352a" font-weight="700">買う前に、線・円・自分の名前を書いてみる</text></svg>