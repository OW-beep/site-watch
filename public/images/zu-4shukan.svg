" stroke="#1a1a1a" stroke-width="2.5"/><text x="107.5" y="303.9" font-size="14" text-anchor="middle" fill="#1a1a1a">夕飯の条件</text><rect x="219" y="70" width="175" height="40" fill="#1a1a1a"/><rect x="215" y="66" width="175" height="40" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="302.5" y="91.2" font-size="19" text-anchor="middle" fill="#1a1a1a" font-weight="700">2週目</text><rect x="215" y="112" width="175" height="36" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="302.5" y="133.8" font-size="14" text-anchor="middle" fill="#1a1a1a">整える・分ける</text><rect x="215" y="156" width="175" height="36" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="302.5" y="177.9" font-size="14" text-anchor="middle" fill="#1a1a1a">言葉あそび</text><rect x="215" y="198" width="175" height="36" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="302.5" y="219.9" font-size="14" text-anchor="middle" fill="#1a1a1a">数あそび</text><rect x="215" y="240" width="175" height="36" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="302.5" y="261.9" font-size="14" text-anchor="middle" fill="#1a1a1a">3行要約</text><rect x="215" y="282" width="175" height="36" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="302.5" y="303.9" font-size="14" text-anchor="middle" fill="#1a1a1a">分け方のコツ</text><rect x="414" y="70" width="175" height="40" fill="#1a1a1a"/><rect x="410" y="66" width="175" height="40" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="497.5" y="91.2" font-size="19" text-anchor="middle" fill="#1a1a1a" font-weight="700">3週目</text><rect x="410" y="112" width="175" height="36" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="497.5" y="133.8" font-size="14" text-anchor="middle" fill="#1a1a1a">見当をつける・比べる</text><rect x="410" y="156" width="175" height="36" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="497.5" y="177.9" font-size="14" text-anchor="middle" fill="#1a1a1a">ざっくり計算</text><rect x="410" y="198" width="175" height="36" fill="#