<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" role="img" aria-label="読書ノートの図。読み終わって5分以内に、一言でいうと、使えそうな一文、明日やること、残った問いの4つを書き、1週間後に見返す。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="800" height="350" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="347" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">読書ノート:1冊を「3行と1つの問い」で残す</text><rect x="34" y="74" width="440" height="250" fill="#1a1a1a"/><rect x="30" y="70" width="440" height="250" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><line x1="44" y1="78" x2="44" y2="312" stroke="#d8352a" stroke-width="2"/><text x="60" y="112" font-size="18" text-anchor="start" fill="#1a1a1a" font-weight="700">①一言でいうと</text><text x="60" y="134" font-size="14" text-anchor="start" fill="#5b5b57">自分の言葉で、1行</text><line x1="58" y1="142" x2="456" y2="142" stroke="#1a1a1a" stroke-width="2.5"/><text x="60" y="164" font-size="18" text-anchor="start" fill="#1a1a1a" font-weight="700">②使えそうな一文</text><text x="60" y="186" font-size="14" text-anchor="start" fill="#5b5b57">引用でなく、言い直す</text><line x1="58" y1="194" x2="456" y2="194" stroke="#1a1a1a" stroke-width="2.5"/><text x="60" y="216" font-size="18" text-anchor="start" fill="#1a1a1a" font-weight="700">③明日やること</text><text x="60" y="238" font-size="14" text-anchor="start" fill="#5b5b57">具体的な行動を1つ</text><line x1="58" y1="246" x2="456" y2="246" stroke="#1a1a1a" stroke-width="2.5"/><text x="60" y="268" font-size="18" text-anchor="start" fill="#1a1a1a" font-weight="700">④残った問い</text><text x="60" y="290" font-size="14" text-anchor="start" fill="#5b5b57">まだ分からないこと</text><line x1="58" y1="298" x2="456" y2="298" stroke="#1a1a1a" stroke-width="2.5"/><rect x="524" y="84" width="250" height="56" fill="#1a1a1a"/><rect x="520" y="80" width="250" height="56" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="645.0" y="101.2" font-size="17" text-anchor="middle" fill="#1a1a1a">読み終わって</text><text x="645.0" y="124.1" font-size="17" text-anchor="middle" fill="#1a1a1a">5分以内に書く</text><line x1="645" y1="138" x2="645" y2="176" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="524" y="184" width="250" height="56" fill="#1a1a1a"/><rect x="520" y="180" width="250" height="56" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="645.0" y="201.2" font-size="17" text-anchor="middle" fill="#1a1a1a">1週間後に</text><text x="645.0" y="224.2" font-size="17" text-anchor="middle" fill="#1a1a1a">見返す</text><line x1="645" y1="238" x2="645" y2="270" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="524" y="278" width="250" height="46" fill="#1a1a1a"/><rect x="520" y="274" width="250" height="46" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="645.0" y="301.4" font-size="16" text-anchor="middle" fill="#1a1a1a">③を実行したか確認</text></svg>