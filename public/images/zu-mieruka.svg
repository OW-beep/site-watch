<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="進捗と課題の見える化の図。作業項目、担当者、期限、現在の状況、課題の有無、次に実施すること、最終更新日の7項目と、未着手、対応中、確認待ち、完了の状況分類。止まっている作業と理由を把握する。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="800" height="360" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="357" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">進捗・課題の管理表:項目は最低限に</text><rect x="20" y="66" width="106" height="50" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="73.0" y="94.6" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">作業項目</text><rect x="130" y="66" width="106" height="50" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="183.0" y="94.6" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">担当者</text><rect x="240" y="66" width="106" height="50" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="293.0" y="94.6" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">期限</text><rect x="350" y="66" width="106" height="50" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="403.0" y="94.6" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">現在の状況</text><rect x="460" y="66" width="106" height="50" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="513.0" y="94.6" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">課題の有無</text><rect x="570" y="66" width="106" height="50" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="623.0" y="94.6" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">次にやること</text><rect x="680" y="66" width="106" height="50" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="733.0" y="94.6" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">最終更新日</text><rect x="20" y="116" width="106" height="36" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><rect x="130" y="116" width="106" height="36" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><rect x="240" y="116" width="106" height="36" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><rect x="350" y="116" width="106" height="36" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><rect x="460" y="116" width="106" height="36" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><rect x="570" y="116" width="106" height="36" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><rect x="680" y="116" width="106" height="36" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><rect x="20" y="152" width="106" height="36" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><rect x="130" y="152" width="106" height="36" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><rect x="240" y="152" width="106" height="36" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><rect x="350" y="152" width="106" height="36" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><rect x="460" y="152" width="106" height="36" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><rect x="570" y="152" width="106" height="36" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><rect x="680" y="152" width="106" height="36" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="400" y="218" font-size="16" text-anchor="middle" fill="#1a1a1a" font-weight="700">状況の分類(定義を、関係者でそろえる)</text><rect x="64" y="236" width="150" height="44" fill="#1a1a1a"/><rect x="60" y="232" width="150" height="44" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="135.0" y="258.9" font-size="18" text-anchor="middle" fill="#1a1a1a" font-weight="700">未着手</text><rect x="244" y="236" width="150" height="44" fill="#1a1a1a"/><rect x="240" y="232" width="150" height="44" fill="#d3e0f5" stroke="#1a1a1a" stroke-width="2.5"/><text x="315.0" y="258.9" font-size="18" text-anchor="middle" fill="#1a1a1a" font-weight="700">対応中</text><rect x="424" y="236" width="150" height="44" fill="#1a1a1a"/><rect x="420" y="232" width="150" height="44" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="495.0" y="258.9" font-size="18" text-anchor="middle" fill="#1a1a1a" font-weight="700">確認待ち</text><rect x="604" y="236" width="150" height="44" fill="#1a1a1a"/><rect x="600" y="232" width="150" height="44" fill="#cfe8d6" stroke="#1a1a1a" stroke-width="2.5"/><text x="675.0" y="258.9" font-size="18" text-anchor="middle" fill="#1a1a1a" font-weight="700">完了</text><rect x="124" y="300" width="560" height="46" fill="#1a1a1a"/><rect x="120" y="296" width="560" height="46" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="400.0" y="323.4" font-size="16" text-anchor="middle" fill="#1a1a1a" font-weight="700">いちばん大事なのは、「止まっている作業」と「その理由」を知ること</text></svg>