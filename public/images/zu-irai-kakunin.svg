<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="依頼を受けるときの確認の図。目的、成果物、期限、期待水準の4点を確認してから作業を始める。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="800" height="360" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="357" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">依頼を受けたら、まず4点を確認する</text><rect x="124" y="66" width="560" height="50" fill="#1a1a1a"/><rect x="120" y="62" width="560" height="50" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="400.0" y="91.9" font-size="18" text-anchor="middle" fill="#1a1a1a" font-weight="700">「次回の会議までに、課題を整理してほしい」</text><line x1="400" y1="114" x2="107" y2="160" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="24" y="166" width="175" height="40" fill="#1a1a1a"/><rect x="20" y="162" width="175" height="40" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="107.5" y="186.7" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="700">① 目的</text><rect x="24" y="212" width="175" height="76" fill="#1a1a1a"/><rect x="20" y="208" width="175" height="76" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="107.5" y="240.4" font-size="14" text-anchor="middle" fill="#1a1a1a">何のために</text><text x="107.5" y="259.3" font-size="14" text-anchor="middle" fill="#1a1a1a">必要か</text><line x1="400" y1="114" x2="302" y2="160" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="219" y="166" width="175" height="40" fill="#1a1a1a"/><rect x="215" y="162" width="175" height="40" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="302.5" y="186.7" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="700">② 成果物</text><rect x="219" y="212" width="175" height="76" fill="#1a1a1a"/><rect x="215" y="208" width="175" height="76" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="302.5" y="240.4" font-size="14" text-anchor="middle" fill="#1a1a1a">何を作るか(一覧だけ?</text><text x="302.5" y="259.3" font-size="14" text-anchor="middle" fill="#1a1a1a">原因・対応策・担当者まで?)</text><line x1="400" y1="114" x2="497" y2="160" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="414" y="166" width="175" height="40" fill="#1a1a1a"/><rect x="410" y="162" width="175" height="40" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="497.5" y="186.7" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="700">③ 期限</text><rect x="414" y="212" width="175" height="76" fill="#1a1a1a"/><rect x="410" y="208" width="175" height="76" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="497.5" y="240.4" font-size="14" text-anchor="middle" fill="#1a1a1a">いつまでに</text><text x="497.5" y="259.3" font-size="14" text-anchor="middle" fill="#1a1a1a">必要か</text><line x1="400" y1="114" x2="692" y2="160" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="609" y="166" width="175" height="40" fill="#1a1a1a"/><rect x="605" y="162" width="175" height="40" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="692.5" y="186.7" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="700">④ 期待水準</text><rect x="609" y="212" width="175" height="76" fill="#1a1a1a"/><rect x="605" y="208" width="175" height="76" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="692.5" y="240.4" font-size="14" text-anchor="middle" fill="#1a1a1a">どの程度の</text><text x="692.5" y="259.3" font-size="14" text-anchor="middle" fill="#1a1a1a">完成度が必要か</text><text x="400" y="322" font-size="17" text-anchor="middle" fill="#d8352a" font-weight="700">細かいことを全部聞かず、重要な点に絞る</text></svg>