<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-label="読み聞かせで、ただ読むだけの時間に子ども側で起きていることを3つに分けた図。絵を指さして確かめる。知っている言葉を一緒に声に出す。好きな場面を覚えていて、また読んでとせがむ。聞いているだけに見えて、子どもは参加している。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><rect width="800" height="340" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="337" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">「ただ読む」時間に、子ども側で起きていること</text><rect x="34" y="78" width="230" height="56" fill="#1a1a1a"/><rect x="30" y="74" width="230" height="56" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="145" y="98" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">絵を指さす</text><text x="145" y="121" font-size="14" text-anchor="middle" fill="#1a1a1a">言葉と絵を結んでいる</text><text x="145" y="162" font-size="14" text-anchor="middle" fill="#1a1a1a">「これ、○○だね」と確かめている</text><rect x="289" y="78" width="230" height="56" fill="#1a1a1a"/><rect x="285" y="74" width="230" height="56" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/><text x="400" y="98" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">言葉を繰り返す</text><text x="400" y="121" font-size="14" text-anchor="middle" fill="#1a1a1a">知っている言葉に反応する</text><text x="400" y="162" font-size="14" text-anchor="middle" fill="#1a1a1a">声に出して、自分のものにしている</text><rect x="544" y="78" width="230" height="56" fill="#1a1a1a"/><rect x="540" y="74" width="230" height="56" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/><text x="655" y="98" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">場面を覚える</text><text x="655" y="121" font-size="14" text-anchor="middle" fill="#1a1a1a">好きな場面をせがんでくる</text><text x="655" y="162" font-size="14" text-anchor="middle" fill="#1a1a1a">先の展開を予想し始めている</text><rect x="120" y="216" width="560" height="64" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="400" y="242" font-size="17" font-weight="700" text-anchor="middle" fill="#1a1a1a">聞いているだけに見えて、子どもは参加している</text><text x="400" y="268" font-size="15" text-anchor="middle" fill="#1a1a1a">「ただ読む」は、子どもの側では「ただ聞く」ではない</text><line x1="145" y1="176" x2="300" y2="212" stroke="#1a1a1a" stroke-width="2.5"/><line x1="400" y1="176" x2="400" y2="212" stroke="#1a1a1a" stroke-width="2.5"/><line x1="655" y1="176" x2="500" y2="212" stroke="#1a1a1a" stroke-width="2.5"/></svg>
