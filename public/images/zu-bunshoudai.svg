<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-label="文章題は紙の上で3つに分ける、という図。聞かれていることに線を引く、分かっている数字に丸をつける、関係を簡単な図に描く。式は最後。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="800" height="340" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="337" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">文章題は、紙の上で3つに分ける</text><rect x="24" y="70" width="250" height="58" fill="#1a1a1a"/><rect x="20" y="66" width="250" height="58" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="145.0" y="99.9" font-size="18" text-anchor="middle" fill="#1a1a1a" font-weight="700">① 聞かれていること</text><rect x="284" y="70" width="500" height="58" fill="#1a1a1a"/><rect x="280" y="66" width="500" height="58" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="530.0" y="99.9" font-size="18" text-anchor="middle" fill="#1a1a1a">最後の文に線を引く。「何を出す問題か」を先に決める</text><rect x="24" y="142" width="250" height="58" fill="#1a1a1a"/><rect x="20" y="138" width="250" height="58" fill="#2E7D4F" stroke="#1a1a1a" stroke-width="2.5"/><text x="145.0" y="171.9" font-size="17" text-anchor="middle" fill="#fff" font-weight="700">② 分かっている数字</text><rect x="284" y="142" width="500" height="58" fill="#1a1a1a"/><rect x="280" y="138" width="500" height="58" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="530.0" y="171.9" font-size="18" text-anchor="middle" fill="#1a1a1a">数字に丸をつけて、何の数かを横に書く</text><rect x="24" y="214" width="250" height="58" fill="#1a1a1a"/><rect x="20" y="210" width="250" height="58" fill="#2f5da8" stroke="#1a1a1a" stroke-width="2.5"/><text x="145.0" y="243.9" font-size="18" text-anchor="middle" fill="#fff" font-weight="700">③ 関係を図に描く</text><rect x="284" y="214" width="500" height="58" fill="#1a1a1a"/><rect x="280" y="210" width="500" height="58" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="530.0" y="243.9" font-size="18" text-anchor="middle" fill="#1a1a1a">長さや量を線で表す。式は、図のあとで作る</text><text x="400" y="318" font-size="16" text-anchor="middle" fill="#d8352a" font-weight="700">式は最後。まず文章を整理する</text></svg>
