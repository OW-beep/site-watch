<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="打ち合わせの認識のずれの図。担当者は進んでいると考え、別の関係者は確認が終わっていないと考えている。決まっていること、決まっていないこと、誰が確認するか、いつまでにを書き出して、ずれを見つける。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="800" height="360" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="357" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">認識のずれは、4項目に書き出すと見える</text><rect x="24" y="74" width="330" height="56" fill="#1a1a1a"/><rect x="20" y="70" width="330" height="56" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="185.0" y="102.4" font-size="16" text-anchor="middle" fill="#1a1a1a">担当者:「作業は進んでいる」</text><rect x="24" y="154" width="330" height="56" fill="#1a1a1a"/><rect x="20" y="150" width="330" height="56" fill="#ffd6d2" stroke="#1a1a1a" stroke-width="2.5"/><text x="185.0" y="182.4" font-size="16" text-anchor="middle" fill="#1a1a1a">別の関係者:「確認が終わっていない」</text><text x="185" y="236" font-size="15" text-anchor="middle" fill="#d8352a" font-weight="700">同じ話題なのに、見ているものが違う</text><line x1="355" y1="140" x2="420" y2="140" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="429" y="74" width="345" height="54" fill="#1a1a1a"/><rect x="425" y="70" width="345" height="54" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="597.5" y="91.0" font-size="15" text-anchor="middle" fill="#1a1a1a">① 決まっていること</text><text x="597.5" y="111.2" font-size="15" text-anchor="middle" fill="#1a1a1a">確認済みの事実</text><rect x="429" y="136" width="345" height="54" fill="#1a1a1a"/><rect x="425" y="132" width="345" height="54" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="597.5" y="153.0" font-size="15" text-anchor="middle" fill="#1a1a1a">② まだ決まっていないこと</text><text x="597.5" y="173.2" font-size="15" text-anchor="middle" fill="#1a1a1a">未確定も書く</text><rect x="429" y="198" width="345" height="54" fill="#1a1a1a"/><rect x="425" y="194" width="345" height="54" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="597.5" y="215.0" font-size="15" text-anchor="middle" fill="#1a1a1a">③ 誰が確認するか</text><text x="597.5" y="235.2" font-size="15" text-anchor="middle" fill="#1a1a1a">担当を1人に</text><rect x="429" y="260" width="345" height="54" fill="#1a1a1a"/><rect x="425" y="256" width="345" height="54" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="597.5" y="277.0" font-size="15" text-anchor="middle" fill="#1a1a1a">④ いつまでに対応するか</text><text x="597.5" y="297.2" font-size="15" text-anchor="middle" fill="#1a1a1a">期限を置く</text><text x="400" y="340" font-size="16" text-anchor="middle" fill="#d8352a" font-weight="700">まず未確定も含めて書き出し、整理は、そのあとで</text></svg>