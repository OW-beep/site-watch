<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-label="仕事の4つの習慣の図。会議前の準備、依頼を受けるときの確認、資料のまとめ方、進捗や課題の見える化は、いずれも、最初に立ち止まって整理する点が共通している。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="800" height="380" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="377" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">4つの習慣に共通すること:最初に、立ち止まって整理する</text><rect x="24" y="70" width="175" height="84" fill="#1a1a1a"/><rect x="20" y="66" width="175" height="84" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="107.5" y="102.0" font-size="15" text-anchor="middle" fill="#1a1a1a">会議の前の準備</text><text x="107.5" y="122.2" font-size="15" text-anchor="middle" fill="#1a1a1a">決めたいことを整理</text><line x1="107" y1="152" x2="400" y2="196" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="219" y="70" width="175" height="84" fill="#1a1a1a"/><rect x="215" y="66" width="175" height="84" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="302.5" y="102.0" font-size="15" text-anchor="middle" fill="#1a1a1a">依頼を受けるときの確認</text><text x="302.5" y="122.2" font-size="15" text-anchor="middle" fill="#1a1a1a">完成イメージを合わせる</text><line x1="302" y1="152" x2="400" y2="196" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="414" y="70" width="175" height="84" fill="#1a1a1a"/><rect x="410" y="66" width="175" height="84" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="497.5" y="102.0" font-size="15" text-anchor="middle" fill="#1a1a1a">資料のまとめ方</text><text x="497.5" y="122.2" font-size="15" text-anchor="middle" fill="#1a1a1a">結論と順番を整理</text><line x1="497" y1="152" x2="400" y2="196" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="609" y="70" width="175" height="84" fill="#1a1a1a"/><rect x="605" y="66" width="175" height="84" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="692.5" y="102.0" font-size="15" text-anchor="middle" fill="#1a1a1a">進捗・課題の見える化</text><text x="692.5" y="122.2" font-size="15" text-anchor="middle" fill="#1a1a1a">止まる場所を一覧に</text><line x1="692" y1="152" x2="400" y2="196" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="154" y="204" width="500" height="62" fill="#1a1a1a"/><rect x="150" y="200" width="500" height="62" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="400.0" y="237.1" font-size="22" text-anchor="middle" fill="#1a1a1a" font-weight="700">一度立ち止まって、整理する</text><rect x="64" y="294" width="220" height="54" fill="#1a1a1a"/><rect x="60" y="290" width="220" height="54" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="170.0" y="321.7" font-size="17" text-anchor="middle" fill="#1a1a1a">紙に書き出す</text><rect x="294" y="294" width="220" height="54" fill="#1a1a1a"/><rect x="290" y="290" width="220" height="54" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="400.0" y="321.7" font-size="17" text-anchor="middle" fill="#1a1a1a">項目を分ける</text><rect x="524" y="294" width="220" height="54" fill="#1a1a1a"/><rect x="520" y="290" width="220" height="54" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="630.0" y="321.7" font-size="17" text-anchor="middle" fill="#1a1a1a">一覧にする</text><text x="400" y="366" font-size="15" text-anchor="middle" fill="#d8352a" font-weight="700">特別なツールや難しい手法はいらない</text></svg>