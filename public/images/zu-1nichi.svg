<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="脱デジの1日の図。食事と家族の時間はスマホを手の届かない場所に置く。仕事では連絡と調べものにスマホを使い、課題は手帳に書く。1日の終わりに手帳で整理。寝る30分前から見ず、寝る前5〜10分は日記。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="800" height="360" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="357" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">脱デジの1日:使う場面と、空ける場面(筆者の例)</text><rect x="24" y="74" width="175" height="44" fill="#1a1a1a"/><rect x="20" y="70" width="175" height="44" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="107.5" y="96.4" font-size="16" text-anchor="middle" fill="#1a1a1a" font-weight="700">食事・家族の時間</text><rect x="24" y="124" width="175" height="170" fill="#1a1a1a"/><rect x="20" y="120" width="175" height="170" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="107" y="148" font-size="16" text-anchor="middle" fill="#d8352a" font-weight="700">置く</text><text x="107" y="182" font-size="14" text-anchor="middle" fill="#1a1a1a">スマホは、手の届かない</text><text x="107" y="212" font-size="14" text-anchor="middle" fill="#1a1a1a">場所に置く</text><line x1="197" y1="92" x2="213" y2="92" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="219" y="74" width="175" height="44" fill="#1a1a1a"/><rect x="215" y="70" width="175" height="44" fill="#d3e0f5" stroke="#1a1a1a" stroke-width="2.5"/><text x="302.5" y="96.4" font-size="16" text-anchor="middle" fill="#1a1a1a" font-weight="700">仕事の時間</text><rect x="219" y="124" width="175" height="170" fill="#1a1a1a"/><rect x="215" y="120" width="175" height="170" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="302" y="148" font-size="16" text-anchor="middle" fill="#d8352a" font-weight="700">使い分け</text><text x="302" y="182" font-size="12" text-anchor="middle" fill="#1a1a1a">連絡・調べものは、スマホを使う</text><text x="302" y="212" font-size="12" text-anchor="middle" fill="#1a1a1a">打ち合わせの課題は、手帳に書く</text><text x="302" y="242" font-size="14" text-anchor="middle" fill="#1a1a1a">通知は、必要なものだけ</text><line x1="392" y1="92" x2="408" y2="92" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="414" y="74" width="175" height="44" fill="#1a1a1a"/><rect x="410" y="70" width="175" height="44" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="497.5" y="96.4" font-size="16" text-anchor="middle" fill="#1a1a1a" font-weight="700">1日の終わり</text><rect x="414" y="124" width="175" height="170" fill="#1a1a1a"/><rect x="410" y="120" width="175" height="170" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="497" y="148" font-size="16" text-anchor="middle" fill="#d8352a" font-weight="700">紙で整理</text><text x="497" y="182" font-size="14" text-anchor="middle" fill="#1a1a1a">手帳で、完了にチェック</text><text x="497" y="212" font-size="14" text-anchor="middle" fill="#1a1a1a">翌日に持ち越すものを整理</text><line x1="587" y1="92" x2="603" y2="92" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="609" y="74" width="175" height="44" fill="#1a1a1a"/><rect x="605" y="70" width="175" height="44" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="692.5" y="96.4" font-size="16" text-anchor="middle" fill="#1a1a1a" font-weight="700">寝る前</text><rect x="609" y="124" width="175" height="170" fill="#1a1a1a"/><rect x="605" y="120" width="175" height="170" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="692" y="148" font-size="16" text-anchor="middle" fill="#d8352a" font-weight="700">空ける</text><text x="692" y="182" font-size="12" text-anchor="middle" fill="#1a1a1a">30分前から、なるべく見ない</text><text x="692" y="212" font-size="14" text-anchor="middle" fill="#1a1a1a">5〜10分、日記を書く</text><text x="400" y="330" font-size="17" text-anchor="middle" fill="#d8352a" font-weight="700">やめるのではなく、場面で使い分ける</text></svg>