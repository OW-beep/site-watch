<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-label="回数券の計算図。1杯100円で11杯なら通常1,100円。10杯分の1,000円で買えるので、1杯あたりは約90.9円。割引率は約9.1パーセント。分母を11に置くか10に置くかで答えが変わる。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><rect width="800" height="340" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="337" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">11杯を1,000円で買うと、1杯はいくらか</text><g fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"><rect x="60" y="76" width="50" height="62"/><rect x="122" y="76" width="50" height="62"/><rect x="184" y="76" width="50" height="62"/><rect x="246" y="76" width="50" height="62"/><rect x="308" y="76" width="50" height="62"/><rect x="370" y="76" width="50" height="62"/><rect x="432" y="76" width="50" height="62"/><rect x="494" y="76" width="50" height="62"/><rect x="556" y="76" width="50" height="62"/><rect x="618" y="76" width="50" height="62"/><rect x="680" y="76" width="50" height="62" fill="#ffe45c"/></g><text x="400" y="166" font-size="16" text-anchor="middle" fill="#1a1a1a">1杯100円 × 11杯 = 通常は1,100円（黄色の1杯が、おまけの分）</text><rect x="60" y="190" width="320" height="56" fill="#1a1a1a"/><rect x="56" y="186" width="320" height="56" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/><text x="216" y="221" font-size="17" font-weight="700" text-anchor="middle" fill="#1a1a1a">払うのは 1,000円</text><rect x="424" y="190" width="320" height="56" fill="#1a1a1a"/><rect x="420" y="186" width="320" height="56" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="580" y="221" font-size="17" font-weight="700" text-anchor="middle" fill="#1a1a1a">1杯あたり 約90.9円</text><text x="400" y="282" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a1a">割引率は約9.1％。分母を「11」に置くか「10」に置くかで、答えが変わる</text></svg>
