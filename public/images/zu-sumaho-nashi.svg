<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-label="スマホがなくても困らない最低限ラインの図。紙にも残すものは家族の電話番号と自宅の住所。出かける前に思い出すものは買い物リスト。道順は目印を言葉にする。全部を覚える必要はなく、ないと困るものだけを分けて備える。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><rect width="800" height="340" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="337" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">スマホがなくても困らない「最低限ライン」</text><rect x="48" y="88" width="224" height="168" fill="#1a1a1a"/><rect x="44" y="84" width="224" height="168" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/><text x="156" y="120" font-size="17" font-weight="700" text-anchor="middle" fill="#1a1a1a">紙にも残す</text><text x="156" y="152" font-size="14" text-anchor="middle" fill="#1a1a1a">家族の電話番号と</text><text x="156" y="178" font-size="14" text-anchor="middle" fill="#1a1a1a">自宅の住所は、紙が1枚</text><text x="156" y="204" font-size="14" text-anchor="middle" fill="#1a1a1a">あるだけで慌てない</text><rect x="292" y="88" width="224" height="168" fill="#1a1a1a"/><rect x="288" y="84" width="224" height="168" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="400" y="120" font-size="17" font-weight="700" text-anchor="middle" fill="#1a1a1a">先に思い出す</text><text x="400" y="152" font-size="14" text-anchor="middle" fill="#1a1a1a">買い物リストは、スマホで</text><text x="400" y="178" font-size="14" text-anchor="middle" fill="#1a1a1a">見る前に、頭で言ってみる</text><text x="400" y="204" font-size="14" text-anchor="middle" fill="#1a1a1a">それが思い出す練習になる</text><rect x="536" y="88" width="224" height="168" fill="#1a1a1a"/><rect x="532" y="84" width="224" height="168" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/><text x="644" y="120" font-size="17" font-weight="700" text-anchor="middle" fill="#1a1a1a">道順は言葉にする</text><text x="644" y="152" font-size="14" text-anchor="middle" fill="#1a1a1a">地図を見たら、目印を2つ</text><text x="644" y="178" font-size="14" text-anchor="middle" fill="#1a1a1a">声に出す。「駅を出て、</text><text x="644" y="204" font-size="14" text-anchor="middle" fill="#1a1a1a">郵便局を右」のように</text><text x="400" y="302" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a1a">全部を覚える必要はない。「ないと困るもの」だけを分けて、備える</text></svg>
