<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="脱デジの5つの型の図:紙に書く、置き場所を決める、先に予想を書く、紙の本を混ぜる、何もしない5分。まず1つだけ選ぶ。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="800" height="300" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="297" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">脱デジの5つの型</text><text x="400" y="90" font-size="20" text-anchor="middle" fill="#1a1a1a" font-weight="700">考える部分だけは、自分の手に残す</text><rect x="24" y="119" width="140" height="110" fill="#1a1a1a"/><rect x="20" y="115" width="140" height="110" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="90.0" y="162.4" font-size="19" text-anchor="middle" fill="#1a1a1a">紙に</text><text x="90.0" y="188.1" font-size="19" text-anchor="middle" fill="#1a1a1a">書く</text><circle cx="42" cy="115" r="15" fill="#d8352a"/><text x="42" y="121" font-size="16" text-anchor="middle" fill="#fff" font-weight="700">1</text><rect x="179" y="119" width="140" height="110" fill="#1a1a1a"/><rect x="175" y="115" width="140" height="110" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="245.0" y="162.4" font-size="19" text-anchor="middle" fill="#1a1a1a">置き場所</text><text x="245.0" y="188.1" font-size="19" text-anchor="middle" fill="#1a1a1a">を決める</text><circle cx="197" cy="115" r="15" fill="#d8352a"/><text x="197" y="121" font-size="16" text-anchor="middle" fill="#fff" font-weight="700">2</text><rect x="334" y="119" width="140" height="110" fill="#1a1a1a"/><rect x="330" y="115" width="140" height="110" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="400.0" y="162.4" font-size="19" text-anchor="middle" fill="#1a1a1a">先に予想</text><text x="400.0" y="188.1" font-size="19" text-anchor="middle" fill="#1a1a1a">を書く</text><circle cx="352" cy="115" r="15" fill="#d8352a"/><text x="352" y="121" font-size="16" text-anchor="middle" fill="#fff" font-weight="700">3</text><rect x="489" y="119" width="140" height="110" fill="#1a1a1a"/><rect x="485" y="115" width="140" height="110" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="555.0" y="162.4" font-size="19" text-anchor="middle" fill="#1a1a1a">紙の本</text><text x="555.0" y="188.1" font-size="19" text-anchor="middle" fill="#1a1a1a">を混ぜる</text><circle cx="507" cy="115" r="15" fill="#d8352a"/><text x="507" y="121" font-size="16" text-anchor="middle" fill="#fff" font-weight="700">4</text><rect x="644" y="119" width="140" height="110" fill="#1a1a1a"/><rect x="640" y="115" width="140" height="110" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="710.0" y="162.4" font-size="19" text-anchor="middle" fill="#1a1a1a">何もしない</text><text x="710.0" y="188.1" font-size="19" text-anchor="middle" fill="#1a1a1a">5分</text><circle cx="662" cy="115" r="15" fill="#d8352a"/><text x="662" y="121" font-size="16" text-anchor="middle" fill="#fff" font-weight="700">5</text><text x="400" y="270" font-size="17" text-anchor="middle" fill="#d8352a" font-weight="700">全部やらなくていい。まず「1つだけ」選んで1週間</text></svg>