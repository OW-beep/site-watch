<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-label="読書の型の図。読む前に目的の問いを1行で立て、先に予想し、読みながら答えを探し、読み終わったら問いに1行で答えて、使い道を1行書く。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="800" height="340" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="337" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">読書:読む前に問いを立て、読んだあとに答える</text><rect x="24" y="80" width="170" height="90" fill="#1a1a1a"/><rect x="20" y="76" width="170" height="90" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="105.0" y="114.2" font-size="17" text-anchor="middle" fill="#1a1a1a">① 問いを1つ</text><text x="105.0" y="137.1" font-size="17" text-anchor="middle" fill="#1a1a1a">「何を知りたい?」</text><line x1="192" y1="121" x2="213" y2="121" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="219" y="80" width="170" height="90" fill="#1a1a1a"/><rect x="215" y="76" width="170" height="90" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="300.0" y="114.2" font-size="17" text-anchor="middle" fill="#1a1a1a">② 先に予想</text><text x="300.0" y="137.1" font-size="17" text-anchor="middle" fill="#1a1a1a">「たぶん、こう」</text><line x1="387" y1="121" x2="408" y2="121" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="414" y="80" width="170" height="90" fill="#1a1a1a"/><rect x="410" y="76" width="170" height="90" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="495.0" y="114.2" font-size="17" text-anchor="middle" fill="#1a1a1a">③ 読みながら</text><text x="495.0" y="137.1" font-size="17" text-anchor="middle" fill="#1a1a1a">答えを探す</text><line x1="582" y1="121" x2="603" y2="121" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="609" y="80" width="170" height="90" fill="#1a1a1a"/><rect x="605" y="76" width="170" height="90" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="690.0" y="114.2" font-size="17" text-anchor="middle" fill="#1a1a1a">④ 読んだあと</text><text x="690.0" y="137.1" font-size="17" text-anchor="middle" fill="#1a1a1a">問いに1行で答える</text><line x1="675" y1="170" x2="675" y2="206" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="484" y="214" width="295" height="50" fill="#1a1a1a"/><rect x="480" y="210" width="295" height="50" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="627.5" y="239.4" font-size="16" text-anchor="middle" fill="#1a1a1a" font-weight="700">+ 自分の仕事・生活での使い道を1行</text><text x="250" y="238" font-size="16" text-anchor="middle" fill="#1a1a1a">読む前に問いがあると、</text><text x="250" y="262" font-size="16" text-anchor="middle" fill="#1a1a1a">「どこを読むか」が決まる</text><text x="400" y="312" font-size="17" text-anchor="middle" fill="#d8352a" font-weight="700">読んだだけで終わらせない。行動につなげる</text></svg>