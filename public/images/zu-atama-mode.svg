<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="目的で頭の使い方を変える図。論理的に詰めたいときは仮説を立てて確かめる。たくさん出したいときは連想で広げる。突飛な案が欲しいときは逆から考える。整理したいときは書き出して分ける。目的が先、方法はあと。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><rect width="800" height="360" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="357" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">目的が変われば、頭の使い方も変わる</text><rect x="34" y="70" width="350" height="52" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="209" y="102" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">詰めたい:仮説→確かめる</text><rect x="416" y="70" width="350" height="52" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/><text x="591" y="102" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">広げたい:連想でつなぐ</text><rect x="34" y="140" width="350" height="52" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/><text x="209" y="172" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">変えたい:逆から考える</text><rect x="416" y="140" width="350" height="52" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="591" y="172" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">整理したい:書き出して分ける</text><rect x="90" y="224" width="620" height="64" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="400" y="250" font-size="17" font-weight="700" text-anchor="middle" fill="#1a1a1a">「アイデアが出ない」の多くは、モードの取り違え</text><text x="400" y="276" font-size="15" text-anchor="middle" fill="#1a1a1a">広げる場面で詰めると止まる。詰める場面で広げると散らかる</text><line x1="209" y1="192" x2="330" y2="220" stroke="#1a1a1a" stroke-width="2.5"/><line x1="591" y1="192" x2="470" y2="220" stroke="#1a1a1a" stroke-width="2.5"/></svg>
