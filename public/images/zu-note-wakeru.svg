<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="ノートの分け方の図。手帳は予定と課題、日記は考えを外に出す、読書ノートは学びの使い道。入れ物は少なくし、役割をはっきりさせる。管理方法を増やしすぎない。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="800" height="360" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="357" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">ノートは「役割」で分ける。増やしすぎない</text><rect x="24" y="74" width="236" height="44" fill="#1a1a1a"/><rect x="20" y="70" width="236" height="44" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="138.0" y="97.5" font-size="20" text-anchor="middle" fill="#1a1a1a" font-weight="700">手帳</text><rect x="24" y="124" width="236" height="110" fill="#1a1a1a"/><rect x="20" y="120" width="236" height="110" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="138.0" y="169.0" font-size="15" text-anchor="middle" fill="#1a1a1a">予定・打ち合わせの課題</text><text x="138.0" y="189.2" font-size="15" text-anchor="middle" fill="#1a1a1a">持ち歩く・毎日見る</text><rect x="286" y="74" width="236" height="44" fill="#1a1a1a"/><rect x="282" y="70" width="236" height="44" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="400.0" y="97.5" font-size="20" text-anchor="middle" fill="#1a1a1a" font-weight="700">日記</text><rect x="286" y="124" width="236" height="110" fill="#1a1a1a"/><rect x="282" y="120" width="236" height="110" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="400.0" y="169.0" font-size="15" text-anchor="middle" fill="#1a1a1a">考えを外に出す</text><text x="400.0" y="189.2" font-size="15" text-anchor="middle" fill="#1a1a1a">家で・寝る前に</text><rect x="548" y="74" width="236" height="44" fill="#1a1a1a"/><rect x="544" y="70" width="236" height="44" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="662.0" y="97.5" font-size="20" text-anchor="middle" fill="#1a1a1a" font-weight="700">読書ノート</text><rect x="548" y="124" width="236" height="110" fill="#1a1a1a"/><rect x="544" y="120" width="236" height="110" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="662.0" y="169.0" font-size="15" text-anchor="middle" fill="#1a1a1a">学びの使い道を1行</text><text x="662.0" y="189.2" font-size="15" text-anchor="middle" fill="#1a1a1a">読み終えたら・週1で見返す</text><rect x="24" y="256" width="760" height="48" fill="#1a1a1a"/><rect x="20" y="252" width="760" height="48" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="400.0" y="281.0" font-size="18" text-anchor="middle" fill="#1a1a1a" font-weight="700">迷ったら:入れ物を増やすより、役割をはっきりさせる</text><text x="400" y="338" font-size="16" text-anchor="middle" fill="#d8352a" font-weight="700">管理方法を増やしすぎると、かえって管理が負担になる</text></svg>