<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" aria-label="売上を2倍にしてという無理難題に7ステップを当てはめた図。言い直し、不明点の確認、分解、仮定、計算、検算、提案の順で、2倍は難しいが1.5倍なら現実的と提案する。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="800" height="460" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="457" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">「売上を2倍に」にAI式7ステップを当てはめる</text><rect x="24" y="70" width="190" height="46" fill="#1a1a1a"/><rect x="20" y="66" width="190" height="46" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="115.0" y="93.7" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="700">①言い直す</text><rect x="234" y="70" width="550" height="46" fill="#1a1a1a"/><rect x="230" y="66" width="550" height="46" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="246" y="95" font-size="16" text-anchor="start" fill="#1a1a1a">「いつまでに、何の売上を2倍にするか」</text><rect x="24" y="125" width="190" height="46" fill="#1a1a1a"/><rect x="20" y="121" width="190" height="46" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="115.0" y="148.7" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="700">②足りない所</text><rect x="234" y="125" width="550" height="46" fill="#1a1a1a"/><rect x="230" y="121" width="550" height="46" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="246" y="150" font-size="16" text-anchor="start" fill="#1a1a1a">期間・対象・現状の売上が不明</text><rect x="24" y=