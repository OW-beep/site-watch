<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" width="800" height="270" role="img" aria-label="書き出しメモの4ステップ:テーマを書く10秒、書き出す1〜3分、丸で囲んで分ける1分、結論を一文にする1分。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="800" height="270" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="267" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">書き出しメモ 4ステップ(約5分)</text><rect x="24" y="84" width="170" height="90" fill="#1a1a1a"/><rect x="20" y="80" width="170" height="90" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="105.0" y="117.8" font-size="18" text-anchor="middle" fill="#1a1a1a">①テーマを</text><text x="105.0" y="142.1" font-size="18" text-anchor="middle" fill="#1a1a1a">書く</text><rect x="55" y="195" width="100" height="34" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="105.0" y="216.4" font-size="16" text-anchor="middle" fill="#1a1a1a">10秒</text><line x1="192" y1="125" x2="218" y2="125" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="224" y="84" width="170" height="90" fill="#1a1a1a"/><rect x="220" y="80" width="170" height="90" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="305.0" y="117.8" font-size="18" text-anchor="middle" fill="#1a1a1a">②制限時間で</text><text x="305.0" y="142.1" font-size="18" text-anchor="middle" fill="#1a1a1a">書き出す</text><rect x="255" y="195" width="100" height="34" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="305.0" y="216.4" font-size="16" text-anchor="middle" fill="#1a1a1a">1〜3分</text><line x1="392" y1="125" x2="418" y2="125" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="424" y="84" width="170" height="90" fill="#1a1a1a"/><rect x="420" y="80" width="170" height="90" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="505.0" y="117.8" font-size="18" text-anchor="middle" fill="#1a1a1a">③同じ仲間を</text><text x="505.0" y="142.1" font-size="18" text-anchor="middle" fill="#1a1a1a">丸で囲む</text><rect x="455" y="195" width="100" height="34" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="505.0" y="216.4" font-size="16" text-anchor="middle" fill="#1a1a1a">1分</text><line x1="592" y1="125" x2="618" y2="125" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="624" y="84" width="170" height="90" fill="#1a1a1a"/><rect x="620" y="80" width="170" height="90" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="705.0" y="117.8" font-size="18" text-anchor="middle" fill="#1a1a1a">④結論を</text><text x="705.0" y="142.1" font-size="18" text-anchor="middle" fill="#1a1a1a">一文にする</text><rect x="655" y="195" width="100" height="34" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="705.0" y="216.4" font-size="16" text-anchor="middle" fill="#1a1a1a">1分</text><text x="400" y="258" font-size="17" text-anchor="middle" fill="#d8352a" font-weight="700">きれいに書かず、速く書く。1枚で終わらせる</text></svg>