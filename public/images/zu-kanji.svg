<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-label="読める力と書ける力は別だという図。読めるのは、見れば分かる、候補から選べる力。書けるのは、何も見ずに形を思い出して再現する力。入力では候補を機械が出してくれるので、思い出す工程が省かれ、書く力が落ちる。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><rect width="800" height="340" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="337" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">「読める」と「書ける」は、別の力</text><rect x="64" y="78" width="310" height="56" fill="#1a1a1a"/><rect x="60" y="74" width="310" height="56" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/><text x="215" y="98" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">読める ＝ 見れば分かる</text><text x="215" y="121" font-size="14" text-anchor="middle" fill="#1a1a1a">候補から「これだ」と選べる力</text><text x="215" y="162" font-size="14" text-anchor="middle" fill="#1a1a1a">変換が候補を出してくれるので保たれる</text><rect x="434" y="78" width="310" height="56" fill="#1a1a1a"/><rect x="430" y="74" width="310" height="56" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="585" y="98" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">書ける ＝ 形を思い出せる</text><text x="585" y="121" font-size="14" text-anchor="middle" fill="#1a1a1a">何も見ずに再現する力</text><text x="585" y="162" font-size="14" text-anchor="middle" fill="#1a1a1a">思い出す工程が省かれると、ここが落ちる</text><rect x="120" y="216" width="560" height="64" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="400" y="242" font-size="17" font-weight="700" text-anchor="middle" fill="#1a1a1a">テスト：名前と住所を、見ないで書けますか</text><text x="400" y="268" font-size="15" text-anchor="middle" fill="#1a1a1a">止まった文字が、いま落ちている力の場所</text><line x1="215" y1="176" x2="320" y2="212" stroke="#1a1a1a" stroke-width="2.5"/><line x1="585" y1="176" x2="480" y2="212" stroke="#1a1a1a" stroke-width="2.5"/></svg>
