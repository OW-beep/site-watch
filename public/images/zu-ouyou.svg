<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 412" width="800" height="412" role="img" aria-label="応用力の正体は型の持ち越し、という図。前の事例を思い出す、同じところと違うところを分ける、同じ部分の手順だけ持ってくる、違う部分は小さく試す、の4つ。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="800" height="412" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="409" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">応用力の正体は「型の持ち越し」</text><rect x="24" y="70" width="250" height="58" fill="#1a1a1a"/><rect x="20" y="66" width="250" height="58" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="145.0" y="99.9" font-size="18" text-anchor="middle" fill="#1a1a1a" font-weight="700">① 前の事例を思い出す</text><rect x="284" y="70" width="500" height="58" fill="#1a1a1a"/><rect x="280" y="66" width="500" height="58" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="530.0" y="99.9" font-size="18" text-anchor="middle" fill="#1a1a1a">似た場面を、過去の経験から1つ探す</text><rect x="24" y="142" width="250" height="58" fill="#1a1a1a"/><rect x="20" y="138" width="250" height="58" fill="#2E7D4F" stroke="#1a1a1a" stroke-width="2.5"/><text x="145.0" y="171.9" font-size="17" text-anchor="middle" fill="#fff" font-weight="700">② 同じと違うを分ける</text><rect x="284" y="142" width="500" height="58" fill="#1a1a1a"/><rect x="280" y="138" width="500" height="58" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="530.0" y="171.9" font-size="18" text-anchor="middle" fill="#1a1a1a">前の事例と、同じところ・違うところを並べる</text><rect x="24" y="214" width="250" height="58" fill="#1a1a1a"/><rect x="20" y="210" width="250" height="58" fill="#2f5da8" stroke="#1a1a1a" stroke-width="2.5"/><text x="145.0" y="243.9" font-size="18" text-anchor="middle" fill="#fff" font-weight="700">③ 同じ部分を持ってくる</text><rect x="284" y="214" width="500" height="58" fill="#1a1a1a"/><rect x="280" y="210" width="500" height="58" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="530.0" y="243.9" font-size="18" text-anchor="middle" fill="#1a1a1a">使える手順だけを、今の場面に運んで使う</text><rect x="24" y="286" width="250" height="58" fill="#1a1a1a"/><rect x="20" y="282" width="250" height="58" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="145.0" y="315.9" font-size="18" text-anchor="middle" fill="#d8352a" font-weight="700">④ 違う部分は小さく試す</text><rect x="284" y="286" width="500" height="58" fill="#1a1a1a"/><rect x="280" y="282" width="500" height="58" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="530.0" y="315.9" font-size="18" text-anchor="middle" fill="#1a1a1a">合わない場所だけ、範囲を絞って試し直す</text><text x="400" y="386" font-size="16" text-anchor="middle" fill="#d8352a" font-weight="700">ゼロから思いつく力ではなく、前の型を運ぶ力</text></svg>
