<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="スマホ代の内訳の図。合計は6,200円から8,700円に2,500円増えた。基本料金と端末の分割払いは変わらず、オプションが1,000円から3,500円に増えたのが原因。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="800" height="360" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="357" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">スマホ代:明細を4つに分けて、増えた場所を探す</text><rect x="24" y="144" width="200" height="84" fill="#1a1a1a"/><rect x="20" y="140" width="200" height="84" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="120.0" y="164.8" font-size="16" text-anchor="middle" fill="#1a1a1a" font-weight="700">スマホ代 合計</text><text x="120.0" y="186.4" font-size="16" text-anchor="middle" fill="#1a1a1a" font-weight="700">6,200 → 8,700円</text><text x="120.0" y="208.0" font-size="16" text-anchor="middle" fill="#1a1a1a" font-weight="700">(+2,500円)</text><rect x="304" y="66" width="480" height="58" fill="#1a1a1a"/><rect x="300" y="62" width="480" height="58" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="540.0" y="95.7" font-size="17" text-anchor="middle" fill="#1a1a1a">基本料金   3,500 → 3,500円   変化なし</text><line x1="222" y1="182" x2="298" y2="91" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="304" y="136" width="480" height="58" fill="#1a1a1a"/><rect x="300" y="132" width="480" height="58" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="540.0" y="165.7" font-size="17" text-anchor="middle" fill="#1a1a1a">端末の分割払い   1,700 → 1,700円   変化なし</text><line x1="222" y1="182" x2="298" y2="161" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="304" y="206" width="480" height="58" fill="#1a1a1a"/><rect x="300" y="202" width="480" height="58" fill="#ffd6d2" stroke="#1a1a1a" stroke-width="2.5"/><text x="540.0" y="235.7" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="700">オプション   1,000 → 3,500円   +2,500円</text><line x1="222" y1="182" x2="298" y2="231" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="304" y="276" width="480" height="58" fill="#1a1a1a"/><rect x="300" y="272" width="480" height="58" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="540.0" y="305.7" font-size="17" text-anchor="middle" fill="#1a1a1a">通話・追加の通信料   0 → 0円   変化なし</text><line x1="222" y1="182" x2="298" y2="301" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><text x="400" y="348" font-size="16" text-anchor="middle" fill="#d8352a" font-weight="700">金額が増えた項目を見つけてから、「なぜ?」を考える</text></svg>