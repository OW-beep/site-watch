<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-label="水道代が急に上がったときの調べ方の図。まず使用水量と請求期間を見て、前回や前年と比べ、暮らしの変化を思い出す。それでも分からなければ、蛇口を全部閉めて水道メーターのパイロットを見て、回っていれば漏水の可能性があるので水道局や指定の工事事業者に連絡する。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="800" height="380" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="377" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">水道代が急に上がったとき:調べる順番</text><text x="20" y="70" font-size="17" text-anchor="start" fill="#d8352a" font-weight="700">まず、数字を見る</text><rect x="24" y="88" width="236" height="70" fill="#1a1a1a"/><rect x="20" y="84" width="236" height="70" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="138.0" y="112.6" font-size="16" text-anchor="middle" fill="#1a1a1a">① 使用水量と</text><text x="138.0" y="134.2" font-size="16" text-anchor="middle" fill="#1a1a1a">請求期間(1か月/2か月)</text><line x1="258" y1="119" x2="280" y2="119" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="286" y="88" width="236" height="70" fill="#1a1a1a"/><rect x="282" y="84" width="236" height="70" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="400.0" y="112.6" font-size="16" text-anchor="middle" fill="#1a1a1a">② 前回・前年の</text><text x="400.0" y="134.2" font-size="16" text-anchor="middle" fill="#1a1a1a">同じ時期と比べる</text><line x1="520" y1="119" x2="542" y2="119" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="548" y="88" width="236" height="70" fill="#1a1a1a"/><rect x="544" y="84" width="236" height="70" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="662.0" y="112.6" font-size="16" text-anchor="middle" fill="#1a1a1a">③ 暮らしの変化を</text><text x="662.0" y="134.2" font-size="16" text-anchor="middle" fill="#1a1a1a">思い出す(来客・在宅など)</text><text x="20" y="196" font-size="17" text-anchor="start" fill="#d8352a" font-weight="700">それでも原因が分からないとき(漏水の確認)</text><rect x="24" y="214" width="236" height="70" fill="#1a1a1a"/><rect x="20" y="210" width="236" height="70" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="138.0" y="239.0" font-size="15" text-anchor="middle" fill="#1a1a1a">④ 家の中と外の蛇口を</text><text x="138.0" y="259.2" font-size="15" text-anchor="middle" fill="#1a1a1a">すべて閉める</text><line x1="258" y1="245" x2="280" y2="245" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="286" y="214" width="236" height="70" fill="#1a1a1a"/><rect x="282" y="210" width="236" height="70" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="400.0" y="239.0" font-size="15" text-anchor="middle" fill="#1a1a1a">⑤ メーターの「パイロット」</text><text x="400.0" y="259.2" font-size="15" text-anchor="middle" fill="#1a1a1a">が回っていないか見る</text><line x1="520" y1="245" x2="542" y2="245" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="548" y="214" width="236" height="70" fill="#1a1a1a"/><rect x="544" y="210" width="236" height="70" fill="#ffd6d2" stroke="#1a1a1a" stroke-width="2.5"/><text x="662.0" y="239.0" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="700">回っていれば、漏水の可能性</text><text x="662.0" y="259.2" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="700">→ 水道局へ連絡</text><text x="400" y="316" font-size="15" text-anchor="middle" fill="#d8352a" font-weight="700">修理は、水道局が指定する工事事業者へ(費用は自己負担)。賃貸は管理会社へ</text><text x="400" y="346" font-size="14" text-anchor="middle" fill="#5b5b57">手順や減免の制度は、自治体で異なります。お住まいの水道局に確認してください</text></svg>