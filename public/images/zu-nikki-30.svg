<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-label="手書き日記30日チャレンジの図。1日3行(今日あったこと、気づいたこと、明日1つだけやること)と、1週間後、2週間後、30日後の記録公開の予定。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="800" height="340" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="337" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">手書き日記30日チャレンジ</text><rect x="34" y="79" width="340" height="235" fill="#1a1a1a"/><rect x="30" y="75" width="340" height="235" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="50" y="130" font-size="18" text-anchor="start" fill="#1a1a1a" font-weight="700">1行目 今日あったこと</text><line x1="48" y1="142" x2="352" y2="142" stroke="#1a1a1a" stroke-width="2.5"/><text x="50" y="185" font-size="18" text-anchor="start" fill="#1a1a1a" font-weight="700">2行目 気づいたこと</text><line x1="48" y1="197" x2="352" y2="197" stroke="#1a1a1a" stroke-width="2.5"/><text x="50" y="240" font-size="18" text-anchor="start" fill="#1a1a1a" font-weight="700">3行目 明日1つだけやること</text><line x1="48" y1="252" x2="352" y2="252" stroke="#1a1a1a" stroke-width="2.5"/><line x1="40" y1="82" x2="40" y2="304" stroke="#d8352a" stroke-width="2"/><text x="600" y="112" font-size="19" text-anchor="middle" fill="#1a1a1a" font-weight="700">記録の公開予定</text><line x1="420" y1="205" x2="780" y2="205" stroke="#1a1a1a" stroke-width="2.5"/><circle cx="450" cy="205" r="9" fill="#d8352a" stroke="#1a1a1a" stroke-width="2"/><text x="450" y="180" font-size="16" text-anchor="middle" fill="#1a1a1a" font-weight="700">開始</text><text x="450" y="245" font-size="14" text-anchor="middle" fill="#1a1a1a">ルールを宣言</text><circle cx="550" cy="205" r="9" fill="#d8352a" stroke="#1a1a1a" stroke-width="2"/><text x="550" y="180" font-size="16" text-anchor="middle" fill="#1a1a1a" font-weight="700">1週間後</text><text x="550" y="245" font-size="14" text-anchor="middle" fill="#1a1a1a">つまずいた点</text><circle cx="650" cy="205" r="9" fill="#d8352a" stroke="#1a1a1a" stroke-width="2"/><text x="650" y="180" font-size="16" text-anchor="middle" fill="#1a1a1a" font-weight="700">2週間後</text><text x="650" y="245" font-size="14" text-anchor="middle" fill="#1a1a1a">ルール変更?</text><circle cx="750" cy="205" r="9" fill="#d8352a" stroke="#1a1a1a" stroke-width="2"/><text x="750" y="180" font-size="16" text-anchor="middle" fill="#1a1a1a" font-weight="700">30日後</text><text x="750" y="245" font-size="14" text-anchor="middle" fill="#1a1a1a">全体のまとめ</text><text x="600" y="300" font-size="16" text-anchor="middle" fill="#d8352a" font-weight="700">3行だけ。続かなくても、恥じるべからず</text></svg>