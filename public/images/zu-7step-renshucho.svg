<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" role="img" aria-label="7ステップの練習帳の図。友達の誕生日会、家計の見直し、週末の大掃除、発表資料、家族旅行の行き先の5つの依頼を、7ステップで分解する。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="800" height="350" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="347" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">7ステップ練習帳:5つの依頼を分解する</text><rect x="24" y="66" width="400" height="38" fill="#1a1a1a"/><rect x="20" y="62" width="400" height="38" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="220.0" y="85.4" font-size="16" text-anchor="middle" fill="#1a1a1a">①「友達の誕生日会を計画して」</text><rect x="24" y="112" width="400" height="38" fill="#1a1a1a"/><rect x="20" y="108" width="400" height="38" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="220.0" y="131.4" font-size="16" text-anchor="middle" fill="#1a1a1a">②「家計を見直して」</text><rect x="24" y="158" width="400" height="38" fill="#1a1a1a"/><rect x="20" y="154" width="400" height="38" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="220.0" y="177.4" font-size="16" text-anchor="middle" fill="#1a1a1a">③「週末の大掃除を段取りして」</text><rect x="24" y="204" width="400" height="38" fill="#1a1a1a"/><rect x="20" y="200" width="400" height="38" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="220.0" y="223.4" font-size="16" text-anchor="middle" fill="#1a1a1a">④「来週の発表資料を作って」</text><rect x="24" y="250" width="400" height="38" fill="#1a1a1a"/><rect x="20" y="246" width="400" height="38" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="220.0" y="269.4" font-size="16" text-anchor="middle" fill="#1a1a1a">⑤「家族旅行の行き先を決めて」</text><line x1="424" y1="160" x2="470" y2="160" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="479" y="74" width="305" height="180" fill="#1a1a1a"/><rect x="475" y="70" width="305" height="180" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="627.5" y="121.2" font-size="16" text-anchor="middle" fill="#1a1a1a" font-weight="700">答え方の7ステップ</text><text x="627.5" y="142.8" font-size="16" text-anchor="middle" fill="#1a1a1a" font-weight="700">1 言い直す  2 足りない所</text><text x="627.5" y="164.4" font-size="16" text-anchor="middle" fill="#1a1a1a" font-weight="700">3 分ける  4 仮定を置く</text><text x="627.5" y="186.0" font-size="16" text-anchor="middle" fill="#1a1a1a" font-weight="700">5 1つずつ答える</text><text x="627.5" y="207.6" font-size="16" text-anchor="middle" fill="#1a1a1a" font-weight="700">6 検算する  7 並べる</text><text x="400" y="296" font-size="16" text-anchor="middle" fill="#d8352a" font-weight="700">全部、身近な依頼。先に自分で分解してから、回答例を開く</text></svg>