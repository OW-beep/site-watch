<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-label="読者からの質問への答え方。記事や編集方針から答えられる質問は、この記事で答える。体験の詳細を問う質問は、答えを作らず、筆者への確認事項として残す。構造などへの指摘は、今後の改善に回す。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><rect width="800" height="330" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="327" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="84" y="37" font-size="21" font-weight="700" fill="#1a1a1a">質問への答え方を、先に決めています</text><rect x="40" y="70" width="720" height="64" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/><rect x="56" y="88" width="120" height="28" fill="#2f5da8"/><text x="116" y="108" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">記事・方針</text><text x="196" y="97" font-size="16" font-weight="700" fill="#1a1a1a">記事や編集方針から答えられる質問</text><text x="196" y="121" font-size="14" fill="#1a1a1a">→ この記事で、正直に答えます</text><rect x="40" y="150" width="720" height="64" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/><rect x="56" y="168" width="120" height="28" fill="#ffe45c" stroke="#1a1a1a" stroke-width="1.5"/><text x="116" y="188" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">体験の詳細</text><text x="196" y="177" font-size="16" font-weight="700" fill="#1a1a1a">体験の細部を問う質問</text><text x="196" y="201" font-size="14" fill="#1a1a1a">→ 答えを作らず、筆者への確認事項として残します</text><rect x="40" y="230" width="720" height="64" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/><rect x="56" y="248" width="120" height="28" fill="#d8352a"/><text x="116" y="268" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">ご指摘</text><text x="196" y="257" font-size="16" font-weight="700" fill="#1a1a1a">構造や分かりにくさへの指摘</text><text x="196" y="281" font-size="14" fill="#1a1a1a">→ 改善の材料として、受け止めます</text></svg>
