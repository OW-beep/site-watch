<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-label="1から10までの合計の図。1と10、2と9、3と8、4と7、5と6のペアはどれも11。11が5組で55。1から100までなら、101が50組で5,050。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="800" height="320" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="317" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">ペアにすると、足し算が一気に楽になる</text><rect x="34" y="74" width="130" height="56" fill="#1a1a1a"/><rect x="30" y="70" width="130" height="56" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="95.0" y="103.2" font-size="19" text-anchor="middle" fill="#1a1a1a">1 + 10 = 11</text><line x1="95" y1="128" x2="95" y2="160" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="184" y="74" width="130" height="56" fill="#1a1a1a"/><rect x="180" y="70" width="130" height="56" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="245.0" y="103.2" font-size="19" text-anchor="middle" fill="#1a1a1a">2 + 9 = 11</text><line x1="245" y1="128" x2="245" y2="160" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="334" y="74" width="130" height="56" fill="#1a1a1a"/><rect x="330" y="70" width="130" height="56" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="395.0" y="103.2" font-size="19" text-anchor="middle" fill="#1a1a1a">3 + 8 = 11</text><line x1="395" y1="128" x2="395" y2="160" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="484" y="74" width="130" height="56" fill="#1a1a1a"/><rect x="480" y="70" width="130" height="56" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="545.0" y="103.2" font-size="19" text-anchor="middle" fill="#1a1a1a">4 + 7 = 11</text><line x1="545" y1="128" x2="545" y2="160" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="634" y="74" width="130" height="56" fill="#1a1a1a"/><rect x="630" y="70" width="130" height="56" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="695.0" y="103.2" font-size="19" text-anchor="middle" fill="#1a1a1a">5 + 6 = 11</text><line x1="695" y1="128" x2="695" y2="160" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="124" y="168" width="560" height="60" fill="#1a1a1a"/><rect x="120" y="164" width="560" height="60" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="400.0" y="200.1" font-size="22" text-anchor="middle" fill="#1a1a1a" font-weight="700">11 × 5組 = 55(1から10の合計)</text><text x="400" y="262" font-size="18" text-anchor="middle" fill="#1a1a1a" font-weight="700">1から100なら、101 × 50組 = 5,050</text><text x="400" y="296" font-size="15" text-anchor="middle" fill="#d8352a" font-weight="700">端と端をペアにする。むずかしい足し算を、同じ数の掛け算に変える</text></svg>