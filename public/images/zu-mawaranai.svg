<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-label="作業の前に書き出す4つの問いの図。1つ目は、何のためにやるのか。2つ目は、誰が何を決めるのか。3つ目は、何が足りていないか。4つ目は、終わりの形はどうなっているか。頭の中だけで考えず紙に置くと、詰まりの場所が見える。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><rect width="800" height="340" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="337" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">作業の前に書き出す、4つの問い</text><rect x="48" y="80" width="344" height="96" fill="#1a1a1a"/><rect x="44" y="76" width="344" height="96" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/><circle cx="82" cy="112" r="17" fill="#d8352a"/><text x="82" y="119" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">1</text><text x="112" y="108" font-size="17" font-weight="700" fill="#1a1a1a">何のためにやるのか</text><text x="112" y="136" font-size="14" fill="#1a1a1a">目的が曖昧だと、手が動いても進まない</text><rect x="416" y="80" width="344" height="96" fill="#1a1a1a"/><rect x="412" y="76" width="344" height="96" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/><circle cx="450" cy="112" r="17" fill="#2f5da8"/><text x="450" y="119" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">2</text><text x="480" y="108" font-size="17" font-weight="700" fill="#1a1a1a">誰が、何を決めるのか</text><text x="480" y="136" font-size="14" fill="#1a1a1a">決める人が分かると、聞く相手が見える</text><rect x="48" y="192" width="344" height="96" fill="#1a1a1a"/><rect x="44" y="188" width="344" height="96" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/><circle cx="82" cy="224" r="17" fill="#2f5da8"/><text x="82" y="231" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">3</text><text x="112" y="220" font-size="17" font-weight="700" fill="#1a1a1a">何が足りていないか</text><text x="112" y="248" font-size="14" fill="#1a1a1a">不足が見えると、作業の前に確認できる</text><rect x="416" y="192" width="344" height="96" fill="#1a1a1a"/><rect x="412" y="188" width="344" height="96" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><circle cx="450" cy="224" r="17" fill="#d8352a"/><text x="450" y="231" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">4</text><text x="480" y="220" font-size="17" font-weight="700" fill="#1a1a1a">終わりの形はどうなっているか</text><text x="480" y="248" font-size="14" fill="#1a1a1a">ゴールが見えると、手順の順番が決まる</text><text x="400" y="322" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a1a">頭の中だけで考えない。紙に置くと、詰まっている場所が見える</text></svg>
