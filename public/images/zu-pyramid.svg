<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" width="800" height="390" role="img" aria-label="ピラミッド構造の図。結論『新店への流出が主因』を、3つの根拠とそれぞれのデータで支える。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="800" height="390" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="387" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">仮説思考とピラミッド構造</text><rect x="214" y="66" width="380" height="66" fill="#1a1a1a"/><rect x="210" y="62" width="380" height="66" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="400.0" y="88.2" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="700">結論</text><text x="400.0" y="111.1" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="700">新店への流出が主因と考えられる</text><line x1="400" y1="130" x2="140" y2="178" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="24" y="184" width="240" height="72" fill="#1a1a1a"/><rect x="20" y="180" width="240" height="72" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="140.0" y="209.6" font-size="16" text-anchor="middle" fill="#1a1a1a">根拠1</text><text x="140.0" y="231.2" font-size="16" text-anchor="middle" fill="#1a1a1a">開始時期が新店と一致</text><line x1="140" y1="254" x2="140" y2="282" stroke="#1a1a1a" stroke-width="2.5"/><rect x="24" y="288" width="240" height="46" fill="#1a1a1a"/><rect x="20" y="284" width="240" height="46" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="140.0" y="311.1" font-size="15" 