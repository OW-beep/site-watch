<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-label="暗算の工夫の図。切りのいい数に寄せて補正する、位ごとに分ける、25や5を使って倍と半分で考える。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="800" height="340" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="337" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">暗算がラクになる3つの工夫</text><rect x="24" y="74" width="236" height="56" fill="#1a1a1a"/><rect x="20" y="70" width="236" height="56" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="138.0" y="102.4" font-size="16" text-anchor="middle" fill="#1a1a1a" font-weight="700">① 切りのいい数に寄せる</text><rect x="24" y="144" width="236" height="110" fill="#1a1a1a"/><rect x="20" y="140" width="236" height="110" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="138.0" y="175.7" font-size="18" text-anchor="middle" fill="#1a1a1a">98 + 47</text><text x="138.0" y="200.0" font-size="18" text-anchor="middle" fill="#1a1a1a">↓</text><text x="138.0" y="224.2" font-size="18" text-anchor="middle" fill="#1a1a1a">100 + 47 − 2 = 145</text><rect x="286" y="74" width="236" height="56" fill="#1a1a1a"/><rect x="282" y="70" width="236" height="56" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="400.0" y="102.4" font-size="16" text-anchor="middle" fill="#1a1a1a" font-weight="700">② 位ごとに分ける</text><rect x="286" y="144" width="236" height="110" fill="#1a1a1a"/><rect x="282" y="140" width="236" height="110" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="400.0" y="175.7" font-size="18" text-anchor="middle" fill="#1a1a1a">47 × 6</text><text x="400.0" y="200.0" font-size="18" text-anchor="middle" fill="#1a1a1a">↓</text><text x="400.0" y="224.2" font-size="18" text-anchor="middle" fill="#1a1a1a">40×6 + 7×6 = 282</text><rect x="548" y="74" width="236" height="56" fill="#1a1a1a"/><rect x="544" y="70" width="236" height="56" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="662.0" y="102.4" font-size="16" text-anchor="middle" fill="#1a1a1a" font-weight="700">③ 25は、100÷4で考える</text><rect x="548" y="144" width="236" height="110" fill="#1a1a1a"/><rect x="544" y="140" width="236" height="110" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="662.0" y="175.7" font-size="18" text-anchor="middle" fill="#1a1a1a">25 × 36</text><text x="662.0" y="200.0" font-size="18" text-anchor="middle" fill="#1a1a1a">↓</text><text x="662.0" y="224.2" font-size="18" text-anchor="middle" fill="#1a1a1a">100×36÷4 = 900</text><text x="400" y="290" font-size="17" text-anchor="middle" fill="#d8352a" font-weight="700">むずかしい数を、やさしい数に変えてから計算する</text></svg>