<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 376" width="800" height="376" role="img" aria-label="フェルミ推定の練習問題10問の難易度の図。やさしい3問、ふつう3問、ややむずかしい2問、実務の2問の4段階。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="800" height="376" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="373" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">フェルミ推定10問:やさしい順のはしご</text><rect x="24" y="70" width="170" height="58" fill="#1a1a1a"/><rect x="20" y="66" width="170" height="58" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="105.0" y="99.9" font-size="18" text-anchor="middle" fill="#1a1a1a" font-weight="700">やさしい</text><rect x="204" y="70" width="580" height="58" fill="#1a1a1a"/><rect x="200" y="66" width="580" height="58" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="490.0" y="99.9" font-size="18" text-anchor="middle" fill="#1a1a1a">①卵 ②洗濯回数 ③通勤電車の回数</text><rect x="24" y="142" width="170" height="58" fill="#1a1a1a"/><rect x="20" y="138" width="170" height="58" fill="#2E7D4F" stroke="#1a1a1a" stroke-width="2.5"/><text x="105.0" y="171.9" font-size="18" text-anchor="middle" fill="#fff" font-weight="700">ふつう</text><rect x="204" y="142" width="580" height="58" fill="#1a1a1a"/><rect x="200" y="138" width="580" height="58" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="490.0" y="171.9" font-size="18" text-anchor="middle" fill="#1a1a1a">④コンビニの客数 ⑤美容室の数 ⑥ラーメンの麺</text><rect x="24" y="214" width="170" hei