<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-label="子どものなぜへの返し方、3つの型の図。型1は聞き返す、どうしてだと思うと子どもの考えを先に出してもらう。型2は一緒に調べる、図鑑で見てみようかと答えを一緒に探す。型3は短く答える、説明は1つだけにして、続きは次のなぜを待つ。すぐに教えるのが悪いわけではなく、考える出番を残すのがコツ。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><rect width="800" height="340" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="337" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">子どもの「なぜ？」への返し方、3つの型</text><rect x="48" y="88" width="224" height="168" fill="#1a1a1a"/><rect x="44" y="84" width="224" height="168" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/><text x="156" y="120" font-size="17" font-weight="700" text-anchor="middle" fill="#1a1a1a">型1 聞き返す</text><text x="156" y="152" font-size="14" text-anchor="middle" fill="#1a1a1a">「どうしてだと思う？」</text><text x="156" y="178" font-size="14" text-anchor="middle" fill="#1a1a1a">子どもの考えを</text><text x="156" y="204" font-size="14" text-anchor="middle" fill="#1a1a1a">先に出してもらう</text><rect x="292" y="88" width="224" height="168" fill="#1a1a1a"/><rect x="288" y="84" width="224" height="168" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="400" y="120" font-size="17" font-weight="700" text-anchor="middle" fill="#1a1a1a">型2 一緒に調べる</text><text x="400" y="152" font-size="14" text-anchor="middle" fill="#1a1a1a">「図鑑で見てみようか」</text><text x="400" y="178" font-size="14" text-anchor="middle" fill="#1a1a1a">答えを一緒に探す</text><text x="400" y="204" font-size="14" text-anchor="middle" fill="#1a1a1a">時間にする</text><rect x="536" y="88" width="224" height="168" fill="#1a1a1a"/><rect x="532" y="84" width="224" height="168" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/><text x="644" y="120" font-size="17" font-weight="700" text-anchor="middle" fill="#1a1a1a">型3 短く答える</text><text x="644" y="152" font-size="14" text-anchor="middle" fill="#1a1a1a">説明は1つだけ</text><text x="644" y="178" font-size="14" text-anchor="middle" fill="#1a1a1a">続きは次の「なぜ？」が</text><text x="644" y="204" font-size="14" text-anchor="middle" fill="#1a1a1a">来てからでいい</text><text x="400" y="302" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a1a">すぐ教えるのが悪いわけではない。考える「出番」を残すのがコツ</text></svg>
