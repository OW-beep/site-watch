<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-label="割り勘の公平を3つに分けた図。金額の公平は、払った額が食べた分と合っているか。手間の公平は、計算や集金の手間が誰かに偏っていないか。気持ちの公平は、全員が納得して終われるか。3つを分けて考えると、結論は場面によって変わる。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><rect width="800" height="320" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="317" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">「公平」は、3つに分けると見えてくる</text><rect x="34" y="74" width="230" height="56" fill="#1a1a1a"/><rect x="30" y="70" width="230" height="56" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="145" y="105" font-size="19" font-weight="700" text-anchor="middle" fill="#1a1a1a">金額の公平</text><text x="145" y="155" font-size="15" text-anchor="middle" fill="#1a1a1a">払った額と、食べた分が合うか</text><rect x="289" y="74" width="230" height="56" fill="#1a1a1a"/><rect x="285" y="70" width="230" height="56" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/><text x="400" y="105" font-size="19" font-weight="700" text-anchor="middle" fill="#1a1a1a">手間の公平</text><text x="400" y="155" font-size="15" text-anchor="middle" fill="#1a1a1a">計算・集金の手間が偏らないか</text><rect x="544" y="74" width="230" height="56" fill="#1a1a1a"/><rect x="540" y="70" width="230" height="56" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/><text x="655" y="105" font-size="19" font-weight="700" text-anchor="middle" fill="#1a1a1a">気持ちの公平</text><text x="655" y="155" font-size="15" text-anchor="middle" fill="#1a1a1a">全員が納得して終われるか</text><rect x="120" y="196" width="560" height="64" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="400" y="222" font-size="17" font-weight="700" text-anchor="middle" fill="#1a1a1a">どれを優先するかで、答えが変わる</text><text x="400" y="248" font-size="15" text-anchor="middle" fill="#1a1a1a">場面ごとに「優先する公平」を先に決めるのがコツ</text><line x1="145" y1="168" x2="300" y2="192" stroke="#1a1a1a" stroke-width="2.5"/><line x1="400" y1="168" x2="400" y2="192" stroke="#1a1a1a" stroke-width="2.5"/><line x1="655" y1="168" x2="500" y2="192" stroke="#1a1a1a" stroke-width="2.5"/></svg>
