<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-label="帰り道を目印でたどる図。自宅から目的地までの道に、駅、大きな交差点、赤い看板の店という3つの目印を置く。行きに目印を3つ決めて覚え、帰りはまず自分で方向を予想してから、アプリで答え合わせをする。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><rect width="800" height="340" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="337" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">帰り道は、「次の角」ではなく「目印」でたどる</text><line x1="90" y1="170" x2="710" y2="170" stroke="#2f5da8" stroke-width="4"/><circle cx="90" cy="170" r="14" fill="#1a1a1a"/><text x="90" y="212" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a1a">出発</text><circle cx="280" cy="170" r="16" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="280" y="130" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a1a">目印1 駅</text><circle cx="470" cy="170" r="16" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="470" y="130" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a1a">目印2 大きな交差点</text><circle cx="620" cy="170" r="16" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="620" y="130" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a1a">目印3 赤い看板の店</text><circle cx="710" cy="170" r="14" fill="#d8352a"/><text x="710" y="212" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a1a">目的地</text><rect x="70" y="248" width="320" height="56" fill="#1a1a1a"/><rect x="66" y="244" width="320" height="56" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/><text x="226" y="279" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a1a">行き：目印を3つ、声に出して覚える</text><rect x="434" y="248" width="320" height="56" fill="#1a1a1a"/><rect x="430" y="244" width="320" height="56" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="590" y="279" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a1a">帰り：まず予想、アプリは答え合わせ</text></svg>
