<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="読んだ本を人に1分で話す型の図。何の本かを10秒、いちばんの学びを30秒、自分の使い道を15秒、ひとこと感想を5秒。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="800" height="300" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="297" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">読んだ本を、1分で話してみる</text><rect x="40" y="80" width="120" height="90" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="100.0" y="118.6" font-size="16" text-anchor="middle" fill="#1a1a1a">何の本?</text><text x="100.0" y="140.2" font-size="16" text-anchor="middle" fill="#1a1a1a">10秒</text><rect x="160" y="80" width="360" height="90" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="340.0" y="118.6" font-size="16" text-anchor="middle" fill="#1a1a1a">いちばんの学び(1つだけ)</text><text x="340.0" y="140.2" font-size="16" text-anchor="middle" fill="#1a1a1a">30秒</text><rect x="520" y="80" width="180" height="90" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="610.0" y="118.6" font-size="16" text-anchor="middle" fill="#1a1a1a">自分の使い道</text><text x="610.0" y="140.2" font-size="16" text-anchor="middle" fill="#1a1a1a">15秒</text><rect x="700" y="80" width="60" height="90" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="730.0" y="119.8" font-size="13" text-anchor="middle" fill="#1a1a1a">感想</text><text x="730.0" y="137.3" font-size="13" text-anchor="middle" fill="#1a1a1a">5秒</text><text x="400" y="214" font-size="18" text-anchor="middle" fill="#d8352a" font-weight="700">話せない部分が、理解できていない部分</text><text x="400" y="250" font-size="15" text-anchor="middle" fill="#1a1a1a">相手がいなくても、声に出して、ひとりで話してよい</text></svg>