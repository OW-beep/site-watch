<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-label="紙の手帳の使い方の図。予定と打ち合わせの課題を書き、1日の終わりに完了にチェックし、翌日に持ち越すものを整理する。デジタルとの二重管理が課題だった。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="800" height="340" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="337" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">紙の手帳:1日の使い方と、つまずき</text><rect x="24" y="74" width="236" height="90" fill="#1a1a1a"/><rect x="20" y="70" width="236" height="90" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="138.0" y="108.6" font-size="16" text-anchor="middle" fill="#1a1a1a">予定と、打ち合わせの</text><text x="138.0" y="130.2" font-size="16" text-anchor="middle" fill="#1a1a1a">課題・確認事項を書く</text><line x1="258" y1="115" x2="280" y2="115" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="286" y="74" width="236" height="90" fill="#1a1a1a"/><rect x="282" y="70" width="236" height="90" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="400.0" y="108.6" font-size="16" text-anchor="middle" fill="#1a1a1a">1日の終わりに</text><text x="400.0" y="130.2" font-size="16" text-anchor="middle" fill="#1a1a1a">完了したものにチェック</text><line x1="520" y1="115" x2="542" y2="115" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="548" y="74" width="236" height="90" fill="#1a1a1a"/><rect x="544" y="70" width="236" height="90" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="662.0" y="108.6" font-size="16" text-anchor="middle" fill="#1a1a1a">翌日に持ち越す</text><text x="662.0" y="130.2" font-size="16" text-anchor="middle" fill="#1a1a1a">タスクを整理する</text><rect x="24" y="194" width="370" height="110" fill="#1a1a1a"/><rect x="20" y="190" width="370" height="110" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="205.0" y="227.8" font-size="16" text-anchor="middle" fill="#1a1a1a">書きながら考えると…</text><text x="205.0" y="249.4" font-size="16" text-anchor="middle" fill="#1a1a1a">優先順位を考える時間になる</text><text x="205.0" y="271.0" font-size="16" text-anchor="middle" fill="#1a1a1a">抜け漏れにも気づきやすい</text><rect x="414" y="194" width="370" height="110" fill="#1a1a1a"/><rect x="410" y="190" width="370" height="110" fill="#ffd6d2" stroke="#1a1a1a" stroke-width="2.5"/><text x="595.0" y="227.8" font-size="16" text-anchor="middle" fill="#1a1a1a">つまずき</text><text x="595.0" y="249.4" font-size="16" text-anchor="middle" fill="#1a1a1a">デジタルの予定表との二重管理</text><text x="595.0" y="271.0" font-size="16" text-anchor="middle" fill="#1a1a1a">転記が面倒で、管理コストが上がった</text><text x="400" y="326" font-size="16" text-anchor="middle" fill="#d8352a" font-weight="700">管理方法を増やしすぎない</text></svg>