<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" width="800" height="410" role="img" aria-label="AIが難しい依頼に答えるときの7ステップの図。依頼を言い直す、足りない所を見つける、小さく分ける、仮定を置く、1つずつ答える、検算する、相手向けに並べる。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="800" height="410" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="407" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">AIが答えを組み立てる7ステップ</text><rect x="24" y="72" width="170" height="112" fill="#1a1a1a"/><rect x="20" y="68" width="170" height="112" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><circle cx="40" cy="88" r="15" fill="#d8352a"/><text x="40" y="94" font-size="16" text-anchor="middle" fill="#fff" font-weight="700">1</text><text x="105" y="123" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="700">依頼を</text><text x="105" y="145" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="700">言い直す</text><text x="105" y="168" font-size="13" text-anchor="middle" fill="#5b5b57">本当の問いは?</text><rect x="224" y="72" width="170" height="112" fill="#1a1a1a"/><rect x="220" y="68" width="170" height="112" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><circle cx="240" cy="88" r="15" fill="#d8352a"/><text x="240" y="94" font-size="16" text-anchor="middle" fill="#fff" font-weight="700">2</text><text x="305" y="123" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="700">足りない所を</text><text x="305" y="145" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="700">見つける</text><text x="305" y="168" font-size="13" text-anchor="middle" fill="#5b5b57">聞く?仮定する?</text><rect x="424" y="72" width="170" height="112" fill="#1a1a1a"/><rect x="420" y="68" width="170" height="112" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><circle cx="440" cy="88" r="15" fill="#d8352a"/><text x="440" y="94" font-size="16" text-anchor="middle" fill="#fff" font-weight="700">3</text><text x="505" y="123" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="700">小さな問い</text><text x="505" y="145" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="700">に分ける</text><text x="505" y="168" font-size="13" text-anchor="middle" fill="#5b5b57">MECEに分解</text><rect x="624" y="72" width="170" height="112" fill="#1a1a1a"/><rect x="620" y="68" width="170" height="112" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><circle cx="640" cy="88" r="15" fill="#d8352a"/><text x="640" y="94" font-size="16" text-anchor="middle" fill="#fff" font-weight="700">4</text><text x="705" y="123" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="700">仮定を</text><text x="705" y="145" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="700">置く</text><text x="705" y="168" font-size="13" text-anchor="middle" fill="#5b5b57">数字・条件を明示</text><line x1="192" y1="124" x2="218" y2="124" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><line x1="392" y1="124" x2="418" y2="124" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><line x1="592" y1="124" x2="618" y2="124" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><line x1="705" y1="182" x2="705" y2="228" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="624" y="234" width="170" height="112" fill="#1a1a1a"/><rect x="620" y="230" width="170" height="112" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><circle cx="640" cy="250" r="15" fill="#d8352a"/><text x="640" y="256" font-size="16" text-anchor="middle" fill="#fff" font-weight="700">5</text><text x="705" y="285" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="700">1つずつ</text><text x="705" y="307" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="700">答える</text><text x="705" y="330" font-size="13" text-anchor="middle" fill="#5b5b57">見積もる・推論する</text><rect x="424" y="234" width="170" height="112" fill="#1a1a1a"/><rect x="420" y="230" width="170" height="112" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><circle cx="440" cy="250" r="15" fill="#d8352a"/><text x="440" y="256" font-size="16" text-anchor="middle" fill="#fff" font-weight="700">6</text><text x="505" y="285" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="700">検算</text><text x="505" y="307" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="700">する</text><text x="505" y="330" font-size="13" text-anchor="middle" fill="#5b5b57">桁・矛盾を確認</text><rect x="224" y="234" width="170" height="112" fill="#1a1a1a"/><rect x="220" y="230" width="170" height="112" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><circle cx="240" cy="250" r="15" fill="#d8352a"/><text x="240" y="256" font-size="16" text-anchor="middle" fill="#fff" font-weight="700">7</text><text x="305" y="285" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="700">相手向けに</text><text x="305" y="307" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="700">並べる</text><text x="305" y="330" font-size="13" text-anchor="middle" fill="#5b5b57">結論→根拠→次の一歩</text><line x1="618" y1="286" x2="392" y2="286" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><line x1="418" y1="286" x2="192" y2="286" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><line x1="218" y1="286" x2="192" y2="286" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="24" y="234" width="170" height="112" fill="#1a1a1a"/><rect x="20" y="230" width="170" height="112" fill="#d8352a" stroke="#1a1a1a" stroke-width="2.5"/><text x="105.0" y="294.2" font-size="30" text-anchor="middle" fill="#fff" font-weight="700">答え</text><text x="400" y="378" font-size="16" text-anchor="middle" fill="#d8352a" font-weight="700">どこかでズレたら前に戻る(⑥でおかしいと気づいたら③④へ)</text><text x="400" y="400" font-size="13" text-anchor="middle" fill="#5b5b57">※ AIの内部の仕組みではなく、答え方の「進め方」を言葉にした型です</text></svg>