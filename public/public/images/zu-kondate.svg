<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" width="800" height="370" role="img" aria-label="夕飯の決め方の図。無数の候補を、冷蔵庫にあるもの、かけられる時間、今の気分の3つの条件で絞り、1品に決める。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="800" height="370" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="367" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">夕飯は「条件」で絞る</text><rect x="54" y="70" width="700" height="56" fill="#1a1a1a"/><rect x="50" y="66" width="700" height="56" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="400.0" y="98.7" font-size="17" text-anchor="middle" fill="#1a1a1a">夕飯の候補(数えきれない)</text><rect x="134" y="138" width="540" height="56" fill="#1a1a1a"/><rect x="130" y="134" width="540" height="56" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="400.0" y="166.7" font-size="17" text-anchor="middle" fill="#1a1a1a">①冷蔵庫にあるもので絞る → 約10品</text><rect x="214" y="206" width="380" height="56" fill="#1a1a1a"/><rect x="210" y="202" width="380" height="56" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="400.0" y="234.7" font-size="17" text-anchor="middle" fill="#1a1a1a">②かけられる時間で絞る → 約4品</text><rect x="284" y="274" width="240" height="56" fill="#1a1a1a"/><rect x="280" y="270" width="240" height="56" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="400.0" y="302.7" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="700">③今の気分で1品に</text><line x1="400" y1="124" x2="400" y2="132" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><line x1="400" y1="192" x2="400" y2="200" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><line x1="400" y1="260" x2="400" y2="268" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><text x="400" y="352" font-size="17" text-anchor="middle" fill="#d8352a" font-weight="700">選ぶより先に「外す」。条件が絞ってくれる</text></svg>