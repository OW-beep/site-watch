<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="振り返りの図。うまくいったこと、想定どおりに進まなかったこと、次回変えることの3点を書く。原因は個人の能力でなく、情報共有、役割分担、確認のタイミングなど仕組みで見る。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="800" height="360" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="357" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">振り返りの3点と、原因の見方</text><rect x="24" y="72" width="236" height="60" fill="#1a1a1a"/><rect x="20" y="68" width="236" height="60" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="138.0" y="102.4" font-size="16" text-anchor="middle" fill="#1a1a1a">① うまくいったこと</text><line x1="258" y1="98" x2="280" y2="98" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="286" y="72" width="236" height="60" fill="#1a1a1a"/><rect x="282" y="68" width="236" height="60" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="400.0" y="102.4" font-size="16" text-anchor="middle" fill="#1a1a1a">② 想定どおり進まなかったこと</text><line x1="520" y1="98" x2="542" y2="98" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="548" y="72" width="236" height="60" fill="#1a1a1a"/><rect x="544" y="68" width="236" height="60" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="662.0" y="102.4" font-size="16" text-anchor="middle" fill="#1a1a1a" font-weight="700">③ 次回変えること</text><text x="400" y="170" font-size="17" text-anchor="middle" fill="#d8352a" font-weight="700">②の原因は、「誰が悪いか」でなく「仕組み」で探す</text><rect x="24" y="199" width="236" height="70" fill="#1a1a1a"/><rect x="20" y="195" width="236" height="70" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="138.0" y="223.6" font-size="16" text-anchor="middle" fill="#1a1a1a">事前の情報共有</text><text x="138.0" y="245.2" font-size="16" text-anchor="middle" fill="#1a1a1a">が足りなかった?</text><rect x="286" y="199" width="236" height="70" fill="#1a1a1a"/><rect x="282" y="195" width="236" height="70" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="400.0" y="223.6" font-size="16" text-anchor="middle" fill="#1a1a1a">役割分担</text><text x="400.0" y="245.2" font-size="16" text-anchor="middle" fill="#1a1a1a">があいまいだった?</text><rect x="548" y="199" width="236" height="70" fill="#1a1a1a"/><rect x="544" y="195" width="236" height="70" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="662.0" y="223.6" font-size="16" text-anchor="middle" fill="#1a1a1a">確認のタイミング</text><text x="662.0" y="245.2" font-size="16" text-anchor="middle" fill="#1a1a1a">が遅かった?</text><rect x="104" y="296" width="600" height="46" fill="#1a1a1a"/><rect x="100" y="292" width="600" height="46" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="400.0" y="319.4" font-size="16" text-anchor="middle" fill="#1a1a1a" font-weight="700">反省会にしない。「次回どうすれば防げるか」に焦点を当てる</text></svg>