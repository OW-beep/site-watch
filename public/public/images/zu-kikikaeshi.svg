<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 415" width="800" height="415" role="img" aria-label="情報が足りないときの判断の図。答えを左右する情報が足りなければ、聞き返しが簡単で安いなら聞く、そうでなければ仮定を書いて進める。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="800" height="415" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="412" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">聞き返すか、仮定で進めるか</text><rect x="304" y="56" width="200" height="40" fill="#1a1a1a"/><rect x="300" y="52" width="200" height="40" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="400.0" y="77.0" font-size="18" text-anchor="middle" fill="#1a1a1a">依頼を受ける</text><line x1="400" y1="98" x2="400" y2="117" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><polygon points="400,117 575,172 400,227 225,172" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="400" y="165.6" font-size="16" text-anchor="middle" fill="#1a1a1a">答えを大きく左右する</text><text x="400" y="187.2" font-size="16" text-anchor="middle" fill="#1a1a1a">情報が足りない?</text><line x1="225" y1="172" x2="192" y2="172" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><text x="208" y="160" font-size="14" text-anchor="middle" fill="#2f5dab" font-weight="700">いいえ</text><rect x="24" y="152" width="170" height="48" fill="#1a1a1a"/><rect x="20" y="148" width="170" height="48" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="105.0" y="176.7" font-size="17" text-anchor="middle" fill="#1a1a1a">そのまま回答</text><line x1="400" y1="228" x2="400" y2="258" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><text x="425" y="248" font-size="14" text-anchor="start" fill="#d8352a" font-weight="700">はい</text><polygon points="400,258 575,313 400,368 225,313" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="400" y="306.6" font-size="16" text-anchor="middle" fill="#1a1a1a">聞き返すのは</text><text x="400" y="328.2" font-size="16" text-anchor="middle" fill="#1a1a1a">簡単で、安い?</text><line x1="225" y1="313" x2="192" y2="313" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><text x="208" y="301" font-size="14" text-anchor="middle" fill="#2f5dab" font-weight="700">はい</text><rect x="24" y="293" width="170" height="48" fill="#1a1a1a"/><rect x="20" y="289" width="170" height="48" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="105.0" y="317.7" font-size="17" text-anchor="middle" fill="#1a1a1a">聞き返す</text><line x1="575" y1="313" x2="608" y2="313" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><text x="592" y="301" font-size="14" text-anchor="middle" fill="#d8352a" font-weight="700">いいえ</text><rect x="614" y="293" width="170" height="48" fill="#1a1a1a"/><rect x="610" y="289" width="170" height="48" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="695.0" y="317.1" font-size="15" text-anchor="middle" fill="#1a1a1a">仮定を書いて進める</text><text x="400" y="398" font-size="16" text-anchor="middle" fill="#d8352a" font-weight="700">仮定で進めるときは、置いた仮定を回答の冒頭に書く</text></svg>