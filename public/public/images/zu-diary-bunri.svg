<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-label="頭の中では、仕事の問題と自分の感情が混ざる。紙に書くと、実際に起きた問題と、勝手な心配ごとに分けられる。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="800" height="330" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="327" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">頭の中では混ざる。紙に書くと分けられる</text><rect x="34" y="74" width="300" height="200" fill="#1a1a1a"/><rect x="30" y="70" width="300" height="200" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="180" y="102" font-size="19" text-anchor="middle" fill="#1a1a1a" font-weight="700">頭の中</text><circle cx="130" cy="180" r="52" fill="#2f5dab" fill-opacity="0.25" stroke="#1a1a1a" stroke-width="2"/><circle cx="215" cy="180" r="52" fill="#d8352a" fill-opacity="0.22" stroke="#1a1a1a" stroke-width="2"/><text x="110" y="176" font-size="14" text-anchor="middle" fill="#1a1a1a">仕事の</text><text x="110" y="196" font-size="14" text-anchor="middle" fill="#1a1a1a">問題</text><text x="236" y="176" font-size="14" text-anchor="middle" fill="#1a1a1a">自分の</text><text x="236" y="196" font-size="14" text-anchor="middle" fill="#1a1a1a">感情</text><text x="180" y="258" font-size="14" text-anchor="middle" fill="#d8352a" font-weight="700">混ざって見分けがつかない</text><line x1="335" y1="170" x2="440" y2="170" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><text x="388" y="150" font-size="16" text-anchor="middle" fill="#1a1a1a" font-weight="700">書く</text><rect x="449" y="74" width="325" height="200" fill="#1a1a1a"/><rect x="445" y="70" width="325" height="200" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="607" y="102" font-size="19" text-anchor="middle" fill="#1a1a1a" font-weight="700">紙の上</text><rect x="469" y="129" width="285" height="56" fill="#1a1a1a"/><rect x="465" y="125" width="285" height="56" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="607.5" y="147.0" font-size="15" text-anchor="middle" fill="#1a1a1a">実際に起きた問題</text><text x="607.5" y="167.2" font-size="15" text-anchor="middle" fill="#1a1a1a">→ 対処できる</text><rect x="469" y="201" width="285" height="56" fill="#1a1a1a"/><rect x="465" y="197" width="285" height="56" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="607.5" y="219.0" font-size="15" text-anchor="middle" fill="#1a1a1a">勝手に心配していること</text><text x="607.5" y="239.2" font-size="15" text-anchor="middle" fill="#1a1a1a">→ 事実を確かめる</text><text x="400" y="312" font-size="16" text-anchor="middle" fill="#d8352a" font-weight="700">「分けられる」ことが、いちばんの収穫だった</text></svg>