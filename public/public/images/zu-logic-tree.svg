<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="ロジックツリーの図。売上は100万円から90万円に10%減。客数が8%減、客単価は約2%減。客数のうちリピート客が150人減っているのが主因。" font-family="'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="800" height="360" fill="#fbf9f3"/><rect x="1.5" y="1.5" width="797" height="357" fill="none" stroke="#1a1a1a" stroke-width="3"/><rect x="18" y="14" width="52" height="30" rx="4" fill="none" stroke="#d8352a" stroke-width="3" transform="rotate(-3 44 29)"/><text x="44" y="36" font-size="18" font-weight="700" fill="#d8352a" text-anchor="middle" transform="rotate(-3 44 29)">図解</text><text x="86" y="38" font-size="21" font-weight="700" fill="#1a1a1a">ロジックツリー:売上減の場所をしぼる</text><rect x="24" y="154" width="190" height="84" fill="#1a1a1a"/><rect x="20" y="150" width="190" height="84" fill="#eadfc6" stroke="#1a1a1a" stroke-width="2.5"/><text x="115.0" y="174.8" font-size="16" text-anchor="middle" fill="#1a1a1a">売上</text><text x="115.0" y="196.4" font-size="16" text-anchor="middle" fill="#1a1a1a">100→90万円</text><text x="115.0" y="218.0" font-size="16" text-anchor="middle" fill="#1a1a1a">(-10%)</text><rect x="269" y="80" width="215" height="84" fill="#1a1a1a"/><rect x="265" y="76" width="215" height="84" fill="#ffe45c" stroke="#1a1a1a" stroke-width="2.5"/><text x="372.5" y="100.8" font-size="16" text-anchor="middle" fill="#1a1a1a">客数</text><text x="372.5" y="122.4" font-size="16" text-anchor="middle" fill="#1a1a1a">2,000→1,840人</text><text x="372.5" y="144.0" font-size="16" text-anchor="middle" fill="#1a1a1a">(-8%)</text><rect x="269" y="248" width="215" height="84" fill="#1a1a1a"/><rect x="265" y="244" width="215" height="84" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="372.5" y="268.8" font-size="16" text-anchor="middle" fill="#1a1a1a">客単価</text><text x="372.5" y="290.4" font-size="16" text-anchor="middle" fill="#1a1a1a">500→約489円</text><text x="372.5" y="312.0" font-size="16" text-anchor="middle" fill="#1a1a1a">(-2%)</text><rect x="549" y="44" width="235" height="70" fill="#1a1a1a"/><rect x="545" y="40" width="235" height="70" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="662.5" y="68.6" font-size="16" text-anchor="middle" fill="#1a1a1a">新規 600→590人</text><text x="662.5" y="90.2" font-size="16" text-anchor="middle" fill="#1a1a1a">(-10人)</text><rect x="549" y="144" width="235" height="70" fill="#1a1a1a"/><rect x="545" y="140" width="235" height="70" fill="#ffd6d2" stroke="#d8352a" stroke-width="2.5"/><text x="662.5" y="168.6" font-size="16" text-anchor="middle" fill="#1a1a1a" font-weight="700">リピート 1,400→1,250人</text><text x="662.5" y="190.2" font-size="16" text-anchor="middle" fill="#1a1a1a" font-weight="700">(-150人)</text><line x1="212" y1="180" x2="263" y2="126" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><line x1="212" y1="205" x2="263" y2="274" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><line x1="482" y1="108" x2="543" y2="76" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><line x1="482" y1="130" x2="543" y2="172" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><text x="662" y="245" font-size="18" text-anchor="middle" fill="#d8352a" font-weight="700">▲ ここが主因</text><text x="662" y="275" font-size="14" text-anchor="middle" fill="#1a1a1a">(客数減160人のうち150人)</text></svg>